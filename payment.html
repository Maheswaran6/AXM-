<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AXM - Payment</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f7f9fc;
      color: #102a43;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 700px;
      padding: 25px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 35px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 34px;
    }

    .file-name {
      font-size: 16px;
      margin: 10px 0;
      color: #52667a;
      word-break: break-word;
    }

    .amount {
      font-size: 28px;
      font-weight: bold;
      margin: 18px 0;
    }

    .summary {
      background: #f5f8fc;
      border-radius: 12px;
      padding: 18px;
      margin: 20px 0;
      text-align: left;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
    }

    .payment-box {
      border: 2px dashed #cbd8e6;
      border-radius: 18px;
      padding: 30px 20px;
      margin-top: 20px;
    }

    .payment-box h2 {
      margin-top: 0;
    }

    .pay-button {
      margin-top: 25px;
      width: 100%;
      max-width: 330px;
      padding: 17px;
      border: none;
      border-radius: 12px;

      background: #f5c518;
      color: #102a43;

      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .pay-button:hover {
      background: #eab900;
    }

    .test-button {
      margin-top: 15px;
      width: 100%;
      max-width: 330px;
      padding: 14px;

      border: 2px solid #2563eb;
      border-radius: 12px;

      background: white;
      color: #2563eb;

      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .test-button:hover {
      background: #2563eb;
      color: white;
    }

    .message {
      margin-top: 20px;
      font-weight: bold;
    }

    .success {
      color: #15803d;
    }

    .error {
      color: #dc2626;
    }

    .small-note {
      margin-top: 25px;
      color: #64748b;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>UPI Payment</h1>

      <div class="file-name" id="fileName">
        Print Document
      </div>

      <div class="amount">
        Amount: ₹<span id="amount">0</span>
      </div>


      <!-- ORDER SUMMARY -->

      <div class="summary">

        <div class="summary-row">
          <strong>Colour</strong>
          <span id="colour">-</span>
        </div>

        <div class="summary-row">
          <strong>Sides</strong>
          <span id="sides">-</span>
        </div>

        <div class="summary-row">
          <strong>Pages</strong>
          <span id="pages">-</span>
        </div>

        <div class="summary-row">
          <strong>Copies</strong>
          <span id="copies">-</span>
        </div>

      </div>


      <!-- PAYMENT -->

      <div class="payment-box">

        <h2>Scan & Pay</h2>

        <p>
          Complete the payment securely using Razorpay.
        </p>

        <button
          id="payButton"
          class="pay-button"
          onclick="startPayment()">

          PAY ₹<span id="payAmount">0</span>

        </button>


        <!-- DEVELOPMENT TEST -->

        <button
          class="test-button"
          onclick="testPayment()">

          TEST PAYMENT SUCCESS → PRINT

        </button>

      </div>


      <div
        id="message"
        class="message">
      </div>


      <div class="small-note">

        Test Payment is available only during development.
        Real payments require Razorpay Test/Live API credentials
        and server-side verification.

      </div>

    </div>

  </div>


  <!-- Razorpay Checkout -->

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>


  <script>

    // ============================================
    // LOAD PRINT OPTIONS
    // ============================================

    const savedOptions =
      localStorage.getItem("axmPrintOptions");


    if (!savedOptions) {

      document.getElementById("message").textContent =
        "Print options not found. Please return to the options page.";

      document.getElementById("message")
        .className = "message error";

    }


    let printOptions = {};

    try {

      printOptions =
        JSON.parse(savedOptions || "{}");

    } catch (error) {

      printOptions = {};

    }


    // ============================================
    // DISPLAY OPTIONS
    // ============================================

    const amount =
      Number(printOptions.amount) || 0;


    document.getElementById("amount")
      .textContent = amount;


    document.getElementById("payAmount")
      .textContent = amount;


    document.getElementById("colour")
      .textContent =
        printOptions.colourName || "-";


    document.getElementById("sides")
      .textContent =
        printOptions.sidesName || "-";


    document.getElementById("pages")
      .textContent =
        printOptions.pages || "-";


    document.getElementById("copies")
      .textContent =
        printOptions.copies || "-";


    // ============================================
    // DOCUMENT NAME
    // ============================================

    const fileName =
      localStorage.getItem("axmFileName");


    if (fileName) {

      document.getElementById("fileName")
        .textContent = fileName;

    }


    // ============================================
    // REAL RAZORPAY PAYMENT
    // ============================================

    async function startPayment() {

      if (amount <= 0) {

        showMessage(
          "Invalid payment amount.",
          true
        );

        return;

      }


      const button =
        document.getElementById("payButton");


      button.disabled = true;

      button.textContent =
        "CREATING PAYMENT...";


      try {

        const response =
          await fetch("/create-order", {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({

              amount: amount,

              currency: "INR",

              printOptions: printOptions

            })

          });


        const data =
          await response.json();


        if (!response.ok || !data.order) {

          throw new Error(
            data.error ||
            "Unable to create payment order."
          );

        }


        // ========================================
        // RAZORPAY CHECKOUT
        // ========================================

        const options = {

          key: data.key,

          amount: data.order.amount,

          currency: data.order.currency,

          name: "AXM",

          description:
            "AXM Printing Service",

          order_id:
            data.order.id,


          handler: async function(response) {

            await verifyPayment(response);

          },


          prefill: {

            name: "",

            email: "",

            contact: ""

          },


          theme: {

            color: "#2563eb"

          },


          modal: {

            ondismiss: function() {

              button.disabled = false;

              button.innerHTML =
                'PAY ₹<span id="payAmount">' +
                amount +
                '</span>';

            }

          }

        };


        const razorpay =
          new Razorpay(options);


        razorpay.on(
          "payment.failed",
          function(response) {

            showMessage(
              "Payment failed. Please try again.",
              true
            );

            button.disabled = false;

            button.innerHTML =
              'PAY ₹<span id="payAmount">' +
              amount +
              '</span>';

          }
        );


        razorpay.open();


      } catch (error) {

        console.error(error);

        showMessage(
          error.message,
          true
        );

        button.disabled = false;

        button.innerHTML =
          'PAY ₹<span id="payAmount">' +
          amount +
          '</span>';

      }

    }


    // ============================================
    // VERIFY PAYMENT
    // ============================================

    async function verifyPayment(paymentResponse) {

      try {

        const response =
          await fetch("/verify-payment", {

            method: "POST",

            headers: {

              "Content-Type":
                "application/json"

            },

            body: JSON.stringify({

              ...paymentResponse,

              printOptions:
                printOptions

            })

          });


        const data =
          await response.json();


        if (!response.ok || !data.success) {

          throw new Error(
            data.error ||
            "Payment verification failed."
          );

        }


        paymentSuccessful(
          paymentResponse.razorpay_payment_id
        );


      } catch (error) {

        showMessage(
          error.message,
          true
        );

      }

    }


    // ============================================
    // TEST PAYMENT
    // ============================================

    function testPayment() {

      if (amount <= 0) {

        showMessage(
          "Invalid amount.",
          true
        );

        return;

      }


      paymentSuccessful(
        "TEST_PAYMENT"
      );

    }


    // ============================================
    // PAYMENT SUCCESS
    // ============================================

    function paymentSuccessful(
      paymentId
    ) {

      localStorage.setItem(

        "axmPayment",

        JSON.stringify({

          success: true,

          paymentId:
            paymentId,

          amount:
            amount,

          printOptions:
            printOptions,

          time:
            new Date().toISOString()

        })

      );


      showMessage(
        "Payment successful! Redirecting...",
        false
      );


      setTimeout(function() {

        window.location.href =
          "print.html";

      }, 1200);

    }


    // ============================================
    // MESSAGE
    // ============================================

    function showMessage(
      message,
      isError
    ) {

      const element =
        document.getElementById("message");


      element.textContent =
        message;


      element.className =
        isError
          ? "message error"
          : "message success";

    }

  </script>

</body>
</html>
