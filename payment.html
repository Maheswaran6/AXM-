<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>AXM — Payment</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>

        /* =====================================================
           SCROLLING
           ===================================================== */

        html {
            height: auto;
            min-height: 100%;
            overflow-y: auto !important;
            overflow-x: hidden !important;
        }

        body {
            height: auto;
            min-height: 100vh;
            margin: 0;
            overflow-y: auto !important;
            overflow-x: hidden !important;
        }

        main {
            min-height: 100vh;
            height: auto;
            overflow: visible !important;
        }

        .panel {
            height: auto;
            min-height: 100vh;
            overflow: visible !important;
        }


        /* =====================================================
           PAYMENT BOX
           ===================================================== */

        .payment-box {
            margin-top: 20px;
            padding: 28px;
            border: 2px dashed #d5dfed;
            border-radius: 18px;
            text-align: center;
        }


        /* =====================================================
           SUMMARY CARD
           ===================================================== */

        .summary-card {
            background: #f3f7fc;
            border-radius: 15px;
            padding: 18px;
            margin: 20px 0;
        }

        .summary-card div {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin: 10px 0;
        }


        /* =====================================================
           FAKE QR
           ===================================================== */

        .fake-qr {
            width: 180px;
            height: 180px;
            margin: 25px auto;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            background:
                repeating-linear-gradient(
                    45deg,
                    #111 0px,
                    #111 8px,
                    #fff 8px,
                    #fff 16px
                );

            color: white;
            font-weight: bold;
            font-size: 18px;
        }


        /* =====================================================
           BUTTON
           ===================================================== */

        .button {
            width: 100%;
            max-width: 330px;

            padding: 16px;

            border: none;
            border-radius: 12px;

            background: #f5c400;
            color: #062b55;

            font-weight: 800;
            font-size: 16px;

            cursor: pointer;
        }

        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }


        /* =====================================================
           SECONDARY BUTTON
           ===================================================== */

        .secondary {
            margin-top: 14px;

            background: white;

            border: 2px solid #2864ff;
            color: #2864ff;
        }


        /* =====================================================
           SUCCESS
           ===================================================== */

        .success {
            color: #12833b;
            font-weight: 700;
        }


        /* =====================================================
           ERROR
           ===================================================== */

        .error {
            color: #dc2626;
            font-weight: 700;
        }

    </style>

</head>


<body>


<main>

    <section class="panel">


        <!-- ================================================
             TITLE
             ================================================ -->

        <h1>
            UPI Payment
        </h1>


        <!-- ================================================
             SUMMARY
             ================================================ -->

        <div id="summary">

            Loading...

        </div>


        <!-- ================================================
             PAYMENT BOX
             ================================================ -->

        <div class="payment-box">


            <h2>
                Scan &amp; Pay
            </h2>


            <p id="paymentHelp">

                Click PAY NOW to open secure Razorpay Checkout.

            </p>


            <!-- ============================================
                 QR
                 ============================================ -->

            <div
                class="fake-qr"
                id="qrPlaceholder"
            >

                RAZORPAY
                <br>
                PAYMENT

            </div>


            <!-- ============================================
                 PAY BUTTON
                 ============================================ -->

            <button
                id="payBtn"
                class="button"
                onclick="startPayment()"
                disabled
            >

                PAY NOW

            </button>


            <!-- ============================================
                 TEST PAYMENT
                 ============================================ -->

            <button
                id="testBtn"
                class="button secondary"
                onclick="testPay()"
                style="display:none"
            >

                TEST PAYMENT → PRINT

            </button>


        </div>


        <!-- ================================================
             MESSAGE
             ================================================ -->

        <p
            id="msg"
            class="muted"
        ></p>


    </section>

</main>



<script>


let job = null;



// ============================================================
// ESCAPE HTML
// ============================================================

function esc(value) {

    return String(
        value ?? ""
    ).replace(
        /[&<>'"]/g,
        function(c) {

            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                "'": "&#39;",
                '"': "&quot;"
            }[c];

        }
    );

}



// ============================================================
// LOAD JOB
// ============================================================

async function load() {

    const msg =
        document.getElementById("msg");


    try {

        const response =
            await fetch("/api/job");


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Unable to load job."
            );

        }


        job =
            data.job;


        if (!job) {

            msg.className =
                "error";

            msg.textContent =
                "No document has been received yet.";

            return;

        }


        // ====================================================
        // JOB DETAILS
        // ====================================================

        const colorText =
            job.colour ||
            job.color ||
            "Black & White";


        const sidesText =
            job.sides ||
            "Single Side";


        const pages =
            Number(job.pages) || 1;


        const copies =
            Number(job.copies) || 1;



        // ====================================================
        // DISPLAY SUMMARY
        // ====================================================

        document.querySelector(
            "#summary"
        ).innerHTML = `

            <p>
                <b>
                    ${esc(job.filename)}
                </b>
            </p>


            <div class="summary-card">


                <div>

                    <b>
                        Colour
                    </b>

                    <span>
                        ${esc(colorText)}
                    </span>

                </div>


                <div>

                    <b>
                        Sides
                    </b>

                    <span>
                        ${esc(sidesText)}
                    </span>

                </div>


                <div>

                    <b>
                        Pages
                    </b>

                    <span>
                        ${pages}
                    </span>

                </div>


                <div>

                    <b>
                        Copies
                    </b>

                    <span>
                        ${copies}
                    </span>

                </div>


            </div>


            <h2>

                Total Amount

                <br>

                ₹${Number(job.amount || 0)}

            </h2>

        `;



        // ====================================================
        // CHECK RAZORPAY
        // ====================================================

        const healthResponse =
            await fetch("/api/health");


        const health =
            await healthResponse.json();


        const payBtn =
            document.getElementById("payBtn");


        const testBtn =
            document.getElementById("testBtn");


        const qr =
            document.getElementById("qrPlaceholder");



        if (
            health.razorpayConfigured
        ) {

            payBtn.disabled =
                false;


            testBtn.style.display =
                "none";


            qr.innerHTML =
                "CLICK PAY<br>TO CONTINUE";


            msg.className =
                "success";


            msg.textContent =
                "Razorpay is ready.";

        }

        else {

            payBtn.disabled =
                true;


            testBtn.style.display =
                "none";


            qr.innerHTML =
                "RAZORPAY<br>NOT CONFIGURED";


            msg.className =
                "error";


            msg.textContent =
                "Razorpay is not configured on the server.";

        }

    }

    catch (error) {

        console.error(error);


        msg.className =
            "error";


        msg.textContent =
            error.message ||
            "Unable to load payment information.";

    }

}



// ============================================================
// START PAYMENT
// ============================================================

async function startPayment() {


    if (!job) {

        alert(
            "No document has been received."
        );

        return;

    }


    const payBtn =
        document.getElementById("payBtn");


    const msg =
        document.getElementById("msg");


    payBtn.disabled =
        true;


    msg.className =
        "muted";


    msg.textContent =
        "Creating secure Razorpay order...";


    try {


        // ====================================================
        // CREATE ORDER
        // ====================================================

        const response =
            await fetch(
                "/api/create-order",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Could not create payment order."
            );

        }


        if (!data.success) {

            throw new Error(
                data.error ||
                "Payment order creation failed."
            );

        }


        // ====================================================
        // RAZORPAY
        // ====================================================

        const options = {

            key:
                data.key_id,

            amount:
                data.amount,

            currency:
                data.currency,

            name:
                "AXM Automatic Xerox Machine",

            description:
                "Printing - " +
                job.filename,

            order_id:
                data.orderId,


            // =================================================
            // PAYMENT SUCCESS
            // =================================================

            handler:
                async function(
                    razorpayResponse
                ) {

                    try {

                        msg.className =
                            "muted";

                        msg.textContent =
                            "Verifying payment securely...";


                        const verifyResponse =
                            await fetch(
                                "/api/verify-payment",
                                {
                                    method:
                                        "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify(
                                            razorpayResponse
                                        )
                                }
                            );


                        const verified =
                            await verifyResponse.json();


                        if (
                            !verifyResponse.ok ||
                            !verified.success
                        ) {

                            throw new Error(
                                verified.error ||
                                "Payment verification failed."
                            );

                        }


                        msg.className =
                            "success";


                        msg.textContent =
                            "✓ Payment successful. Starting print...";


                        await startPrinting(
                            verified.job.id
                        );

                    }

                    catch (error) {

                        console.error(error);


                        msg.className =
                            "error";


                        msg.textContent =
                            error.message ||
                            "Payment verification failed.";


                        payBtn.disabled =
                            false;

                    }

                },


            // =================================================
            // PAYMENT WINDOW CLOSED
            // =================================================

            modal: {

                ondismiss:
                    function() {

                        payBtn.disabled =
                            false;


                        msg.className =
                            "error";


                        msg.textContent =
                            "Payment window closed.";

                    }

            },


            // =================================================
            // THEME
            // =================================================

            theme: {

                color:
                    "#0b57d0"

            }

        };


        const razorpay =
            new Razorpay(
                options
            );


        // ====================================================
        // PAYMENT FAILED
        // ====================================================

        razorpay.on(
            "payment.failed",
            function(response) {

                console.error(
                    "Payment failed:",
                    response
                );


                msg.className =
                    "error";


                msg.textContent =
                    "Payment failed: " +
                    (
                        response.error?.description ||
                        "Please try again."
                    );


                payBtn.disabled =
                    false;

            }
        );


        razorpay.open();

    }

    catch (error) {

        console.error(error);


        msg.className =
            "error";


        msg.textContent =
            error.message ||
            "Unable to start payment.";


        payBtn.disabled =
            false;

    }

}



// ============================================================
// START PRINTING
// ============================================================

async function startPrinting(
    jobId
) {

    const msg =
        document.getElementById("msg");


    try {

        const response =
            await fetch(
                "/api/print",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            jobId:
                                jobId
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Print start failed."
            );

        }


        msg.className =
            "success";


        msg.textContent =
            "✓ Payment successful. Printing started.";


        console.log(
            "PRINT STARTED:",
            data
        );

    }

    catch (error) {

        console.error(error);


        msg.className =
            "error";


        msg.textContent =
            error.message ||
            "Unable to start printing.";

    }

}



// ============================================================
// TEST PAYMENT
// ============================================================

async function testPay() {

    const msg =
        document.getElementById("msg");


    try {

        msg.className =
            "muted";


        msg.textContent =
            "Testing payment...";


        const response =
            await fetch(
                "/api/test-payment",
                {
                    method:
                        "POST"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Test payment failed."
            );

        }


        msg.className =
            "success";


        msg.textContent =
            "Test payment successful.";


        await startPrinting(
            data.job.id
        );

    }

    catch (error) {

        console.error(error);


        msg.className =
            "error";


        msg.textContent =
            error.message ||
            "Test payment failed.";

    }

}



// ============================================================
// START
// ============================================================

load();


</script>


</body>

</html>
