<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>AXM — Payment</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <style>

    .payment-box {
      margin-top: 20px;
      padding: 28px;
      border: 2px dashed #d5dfed;
      border-radius: 18px;
      text-align: center;
    }

    .summary-card {
      background: #f3f7fc;
      border-radius: 15px;
      padding: 18px;
      margin: 20px 0;
    }

    .summary-card div {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin: 10px 0;
    }

    .fake-qr {
      width: 180px;
      height: 180px;
      margin: 25px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background:
        repeating-linear-gradient(
          45deg,
          #111 0px,
          #111 8px,
          #fff 8px,
          #fff 16px
        );
      color: white;
      font-weight: bold;
      font-size: 18px;
    }

    .button {
      width: 100%;
      max-width: 330px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #f5c400;
      color: #062b55;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
    }

    .button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .secondary {
      margin-top: 14px;
      background: white;
      border: 2px solid #2864ff;
      color: #2864ff;
    }

    .success {
      color: #12833b;
      font-weight: 700;
    }

    .error {
      color: #dc2626;
      font-weight: 700;
    }

  </style>

</head>

<body>

<main>

<section class="panel">

  <h1>UPI Payment</h1>

  <div id="summary">
    Loading...
  </div>

  <div class="payment-box">

    <h2>Scan &amp; Pay</h2>

    <p id="paymentHelp">
      Click PAY to open secure Razorpay Checkout.
    </p>

    <div
      class="fake-qr"
      id="qrPlaceholder"
    >
      RAZORPAY<br>
      PAYMENT
    </div>

    <button
      id="payBtn"
      class="button"
      onclick="startPayment()"
    >
      PAY NOW
    </button>

    <button
      id="testBtn"
      class="button secondary"
      onclick="testPay()"
      style="display:none"
    >
      TEST PAYMENT SUCCESS → PRINT
    </button>

  </div>

  <p
    id="msg"
    class="muted"
  ></p>

</section>

</main>

<script>

let job = null;

// ======================================================
// ESCAPE HTML
// ======================================================

function esc(value) {

  return String(
    value ?? ""
  ).replace(
    /[&<>'"]/g,
    function(c) {

      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "'": "&#39;",
        '"': "&quot;"
      }[c];

    }
  );
}

// ======================================================
// LOAD JOB
// ======================================================

async function load() {

  try {

    const response =
      await fetch("/api/job");

    const data =
      await response.json();

    job =
      data.job;

    if (!job) {

      window.location.href =
        "/machine.html";

      return;
    }

    const colorText =
      job.color === "color"
        ? "Colour"
        : "Black & White";

    const sidesText =
      job.sides === "double"
        ? "Double Side"
        : "Single Side";

    document.querySelector(
      "#summary"
    ).innerHTML = `

      <p>
        <b>${esc(job.filename)}</b>
      </p>

      <div class="summary-card">

        <div>
          <b>Colour</b>
          <span>${colorText}</span>
        </div>

        <div>
          <b>Sides</b>
          <span>${sidesText}</span>
        </div>

        <div>
          <b>Pages</b>
          <span>${job.pages || 1}</span>
        </div>

        <div>
          <b>Copies</b>
          <span>${job.copies || 1}</span>
        </div>

      </div>

      <h2>
        Amount: ₹${Number(job.amount || 0)}
      </h2>
    `;

    // Check server

    const healthResponse =
      await fetch("/api/health");

    const health =
      await healthResponse.json();

    const payBtn =
      document.querySelector("#payBtn");

    const testBtn =
      document.querySelector("#testBtn");

    const qr =
      document.querySelector("#qrPlaceholder");

    const msg =
      document.querySelector("#msg");

    if (
      health.razorpayConfigured
    ) {

      payBtn.disabled =
        false;

      testBtn.style.display =
        "none";

      qr.innerHTML =
        "CLICK PAY<br>TO CONTINUE";

      msg.textContent =
        "Razorpay is ready.";

      msg.className =
        "success";

    } else {

      payBtn.disabled =
        true;

      testBtn.style.display =
        "block";

      qr.innerHTML =
        "RAZORPAY<br>NOT CONFIGURED";

      msg.textContent =
        "Razorpay is not configured on the server.";

      msg.className =
        "error";
    }

  } catch (error) {

    console.error(error);

    document.querySelector(
      "#msg"
    ).textContent =
      "Unable to load payment information.";

  }
}

// ======================================================
// START REAL RAZORPAY PAYMENT
// ======================================================

async function startPayment() {

  if (!job) {
    return;
  }

  const payBtn =
    document.querySelector("#payBtn");

  const msg =
    document.querySelector("#msg");

  payBtn.disabled =
    true;

  msg.className =
    "muted";

  msg.textContent =
    "Creating secure Razorpay order...";

  try {

    // Create order on server

    const response =
      await fetch(
        "/api/payment/create-order",
        {
          method: "POST"
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.error ||
        "Could not create payment order."
      );
    }

    // Razorpay Checkout options

    const options = {

      key:
        data.keyId,

      amount:
        data.amount,

      currency:
        data.currency,

      name:
        "AXM Automatic Xerox Machine",

      description:
        `Printing - ${job.filename}`,

      order_id:
        data.orderId,

      handler:
        async function(response) {

          try {

            msg.textContent =
              "Verifying payment securely...";

            // Send payment response
            // to our server.

            const verifyResponse =
              await fetch(
                "/api/payment/verify",
                {
                  method: "POST",

                  headers: {
                    "Content-Type":
                      "application/json"
                  },

                  body:
                    JSON.stringify(response)
                }
              );

            const verified =
              await verifyResponse.json();

            if (!verifyResponse.ok) {

              throw new Error(
                verified.error ||
                "Payment verification failed."
              );
            }

            msg.className =
              "success";

            msg.textContent =
              "Payment successful. Starting print...";

            await startPrinting(
              verified.job.id
            );

          } catch (error) {

            console.error(error);

            msg.className =
              "error";

            msg.textContent =
              error.message;

            payBtn.disabled =
              false;
          }
        },

      modal: {

        ondismiss:
          function() {

            payBtn.disabled =
              false;

            msg.textContent =
              "Payment window closed.";

          }
      },

      theme: {

        color:
          "#0b57d0"
      }
    };

    const razorpay =
      new Razorpay(options);

    razorpay.on(
      "payment.failed",
      function(response) {

        console.error(
          "Payment failed:",
          response
        );

        msg.className =
          "error";

        msg.textContent =
          "Payment failed: " +
          (
            response.error?.description ||
            "Please try again."
          );

        payBtn.disabled =
          false;
      }
    );

    razorpay.open();

  } catch (error) {

    console.error(error);

    msg.className =
      "error";

    msg.textContent =
      error.message;

    payBtn.disabled =
      false;
  }
}

// ======================================================
// START PRINT
// ======================================================

async function startPrinting(
  jobId
) {

  const msg =
    document.querySelector("#msg");

  try {

    const response =
      await fetch(
        "/api/print/start",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              jobId
            })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.error ||
        "Print start failed."
      );
    }

    msg.className =
      "success";

    msg.textContent =
      "Payment successful. Printing started.";

  } catch (error) {

    msg.className =
      "error";

    msg.textContent =
      error.message;
  }
}

// ======================================================
// DEVELOPMENT TEST PAYMENT
// ======================================================

async function testPay() {

  const msg =
    document.querySelector("#msg");

  try {

    msg.textContent =
      "Testing payment...";

    const response =
      await fetch(
        "/api/payment/test-success",
        {
          method: "POST"
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.error ||
        "Test payment failed."
      );
    }

    msg.className =
      "success";

    msg.textContent =
      "Test payment successful.";

    await startPrinting(
      data.job.id
    );

  } catch (error) {

    msg.className =
      "error";

    msg.textContent =
      error.message;
  }
}

// ======================================================
// START
// ======================================================

load();

</script>

</body>
</html>
