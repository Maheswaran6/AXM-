<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>AXM — Payment</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #eef6fc;
            color: #123b70;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* =====================================================
           MAIN
           ===================================================== */

        main {

            width: 100%;

            display: flex;

            justify-content: center;

            align-items: flex-start;

            padding: 20px 15px 30px;
        }


        /* =====================================================
           MAIN PANEL
           ===================================================== */

        .panel {

            width: 100%;

            max-width: 760px;

            background: #ffffff;

            border-radius: 20px;

            padding: 24px 28px 30px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.10);

            text-align: center;
        }


        /* =====================================================
           TITLE
           ===================================================== */

        .page-title {

            margin: 0;

            font-size: 30px;

            font-weight: 800;

            color: #123f7a;
        }


        .document-name {

            margin-top: 8px;

            font-size: 16px;

            font-weight: 700;

            color: #426486;

            word-break: break-word;
        }


        /* =====================================================
           SUMMARY
           ===================================================== */

        .summary-card {

            width: 100%;

            max-width: 430px;

            margin: 18px auto 16px;

            padding: 14px 20px;

            background: #f3f7fc;

            border-radius: 15px;

            border: 1px solid #dce8f5;
        }


        .summary-item {

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 3px;

            margin: 8px 0;
        }


        .summary-label {

            font-size: 14px;

            font-weight: 700;

            color: #55718f;
        }


        .summary-value {

            font-size: 16px;

            font-weight: 700;

            color: #123b70;
        }


        /* =====================================================
           AMOUNT
           ===================================================== */

        .amount-section {

            margin: 8px auto 18px;

            text-align: center;
        }


        .amount-label {

            font-size: 16px;

            font-weight: 700;

            color: #55718f;
        }


        .amount {

            margin-top: 3px;

            font-size: 36px;

            font-weight: 800;

            color: #123f7a;
        }


        /* =====================================================
           PAYMENT BOX
           ===================================================== */

        .payment-box {

            width: 100%;

            max-width: 500px;

            margin: 0 auto;

            padding: 20px 20px 22px;

            border: 2px dashed #d5dfed;

            border-radius: 18px;

            text-align: center;

            background: #fafdff;
        }


        .payment-box h2 {

            margin: 0;

            font-size: 23px;

            color: #123f7a;
        }


        .payment-help {

            margin: 7px 0 14px;

            font-size: 14px;

            color: #55718f;
        }


        /* =====================================================
           PAYMENT PLACEHOLDER
           ===================================================== */

        .payment-placeholder {

            width: 150px;

            height: 150px;

            margin: 12px auto 18px;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            border-radius: 12px;

            background:
                repeating-linear-gradient(
                    45deg,
                    #111 0px,
                    #111 7px,
                    #ffffff 7px,
                    #ffffff 14px
                );

            color: #ffffff;

            font-size: 16px;

            font-weight: 800;

            line-height: 1.2;

            text-shadow:
                0 1px 3px #000;
        }


        /* =====================================================
           BUTTON
           ===================================================== */

        .button {

            display: block;

            width: 100%;

            max-width: 330px;

            margin: 0 auto;

            padding: 14px 18px;

            border: none;

            border-radius: 12px;

            background: #f5c400;

            color: #062b55;

            font-size: 17px;

            font-weight: 800;

            cursor: pointer;
        }


        .button:hover {

            background: #e9b900;
        }


        .button:disabled {

            opacity: 0.5;

            cursor: not-allowed;
        }


        .secondary {

            margin-top: 10px;

            background: #ffffff;

            border: 2px solid #2864ff;

            color: #2864ff;
        }


        /* =====================================================
           MESSAGE
           ===================================================== */

        #msg {

            min-height: 22px;

            margin: 12px 0 0;

            text-align: center;

            font-size: 14px;

            font-weight: 700;
        }


        .success {

            color: #12833b;
        }


        .error {

            color: #dc2626;
        }


        .muted {

            color: #55718f;
        }


        /* =====================================================
           TABLET
           ===================================================== */

        @media (max-width: 700px) {

            main {

                padding:
                    12px 10px 25px;
            }


            .panel {

                padding:
                    20px 16px 24px;

                border-radius:
                    17px;
            }


            .page-title {

                font-size:
                    27px;
            }


            .document-name {

                font-size:
                    15px;
            }


            .summary-card {

                max-width:
                    390px;

                padding:
                    12px 15px;
            }


            .payment-box {

                padding:
                    18px 14px 20px;
            }

        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 480px) {

            main {

                padding:
                    8px 7px 20px;
            }


            .panel {

                padding:
                    18px 12px 22px;
            }


            .page-title {

                font-size:
                    24px;
            }


            .document-name {

                font-size:
                    14px;
            }


            .summary-card {

                margin-top:
                    14px;

                padding:
                    10px 12px;
            }


            .summary-item {

                margin:
                    7px 0;
            }


            .summary-label {

                font-size:
                    13px;
            }


            .summary-value {

                font-size:
                    15px;
            }


            .amount {

                font-size:
                    32px;
            }


            .payment-box h2 {

                font-size:
                    21px;
            }


            .payment-help {

                font-size:
                    13px;
            }


            .payment-placeholder {

                width:
                    135px;

                height:
                    135px;
            }


            .button {

                max-width:
                    300px;

                padding:
                    13px;

                font-size:
                    16px;
            }

        }

    </style>

</head>


<body>

<main>

    <section class="panel">


        <!-- =================================================
             TITLE
             ================================================= -->

        <h1 class="page-title">
            UPI Payment
        </h1>


        <!-- =================================================
             DOCUMENT NAME
             ================================================= -->

        <div
            id="documentName"
            class="document-name"
        >
            Loading...
        </div>


        <!-- =================================================
             PRINT SUMMARY
             ================================================= -->

        <div
            id="summary"
            class="summary-card"
        >
            Loading...
        </div>


        <!-- =================================================
             AMOUNT
             ================================================= -->

        <div class="amount-section">

            <div class="amount-label">
                Total Amount
            </div>

            <div
                id="amount"
                class="amount"
            >
                ₹0
            </div>

        </div>


        <!-- =================================================
             PAYMENT
             ================================================= -->

        <div class="payment-box">

            <h2>
                Scan &amp; Pay
            </h2>


            <p
                id="paymentHelp"
                class="payment-help"
            >
                Click PAY NOW to open secure Razorpay Checkout.
            </p>


            <div
                class="payment-placeholder"
                id="qrPlaceholder"
            >
                CLICK PAY<br>
                TO CONTINUE
            </div>


            <button
                id="payBtn"
                class="button"
                onclick="startPayment()"
                disabled
            >
                PAY NOW
            </button>


            <button
                id="testBtn"
                class="button secondary"
                onclick="testPay()"
                style="display:none"
            >
                TEST PAYMENT → PRINT
            </button>

        </div>


        <!-- =================================================
             MESSAGE
             ================================================= -->

        <p
            id="msg"
            class="muted"
        ></p>


    </section>

</main>


<script>

let job = null;


/* ============================================================
   ESCAPE HTML
   ============================================================ */

function esc(value) {

    return String(
        value ?? ""
    ).replace(
        /[&<>'"]/g,
        function(c) {

            return {

                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                "'": "&#39;",
                '"': "&quot;"

            }[c];

        }
    );

}


/* ============================================================
   LOAD JOB
   ============================================================ */

async function load() {

    const msg =
        document.getElementById("msg");

    try {

        const response =
            await fetch(
                "/api/job",
                {
                    cache: "no-store"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Unable to load job."
            );

        }


        job =
            data.job;


        if (!job) {

            msg.className =
                "error";

            msg.textContent =
                "No document has been received yet.";

            return;

        }


        /* ====================================================
           DOCUMENT NAME
           ==================================================== */

        document.getElementById(
            "documentName"
        ).textContent =
            job.filename ||
            "Document";


        /* ====================================================
           VALUES
           ==================================================== */

        const colorText =
            job.colour ||
            job.color ||
            "Black & White";


        const sidesText =
            job.sides ||
            "Single Side";


        const pages =
            Number(job.pages || 1);


        const copies =
            Number(job.copies || 1);


        const amount =
            Number(job.amount || 0);


        /* ====================================================
           SUMMARY
           ==================================================== */

        document.getElementById(
            "summary"
        ).innerHTML = `

            <div class="summary-item">

                <div class="summary-label">
                    Colour
                </div>

                <div class="summary-value">
                    ${esc(colorText)}
                </div>

            </div>


            <div class="summary-item">

                <div class="summary-label">
                    Sides
                </div>

                <div class="summary-value">
                    ${esc(sidesText)}
                </div>

            </div>


            <div class="summary-item">

                <div class="summary-label">
                    Pages
                </div>

                <div class="summary-value">
                    ${pages}
                </div>

            </div>


            <div class="summary-item">

                <div class="summary-label">
                    Copies
                </div>

                <div class="summary-value">
                    ${copies}
                </div>

            </div>

        `;


        /* ====================================================
           AMOUNT
           ==================================================== */

        document.getElementById(
            "amount"
        ).textContent =
            "₹" +
            amount;


        /* ====================================================
           CHECK RAZORPAY
           ==================================================== */

        const healthResponse =
            await fetch(
                "/api/health",
                {
                    cache: "no-store"
                }
            );


        const health =
            await healthResponse.json();


        const payBtn =
            document.getElementById(
                "payBtn"
            );


        const testBtn =
            document.getElementById(
                "testBtn"
            );


        const qr =
            document.getElementById(
                "qrPlaceholder"
            );


        if (
            health.razorpayConfigured
        ) {

            payBtn.disabled =
                false;


            testBtn.style.display =
                "none";


            qr.innerHTML =
                "CLICK PAY<br>TO CONTINUE";


            msg.className =
                "success";


            msg.textContent =
                "Razorpay is ready.";

        }

        else {

            payBtn.disabled =
                true;


            testBtn.style.display =
                "none";


            qr.innerHTML =
                "RAZORPAY<br>NOT CONFIGURED";


            msg.className =
                "error";


            msg.textContent =
                "Razorpay is not configured on the server.";

        }

    }

    catch (error) {

        console.error(
            error
        );


        msg.className =
            "error";


        msg.textContent =
            error.message ||
            "Unable to load payment information.";

    }

}


/* ============================================================
   REAL RAZORPAY PAYMENT
   ============================================================ */

async function startPayment() {

    if (!job) {

        alert(
            "No document has been received."
        );

        return;

    }


    const payBtn =
        document.getElementById(
            "payBtn"
        );


    const msg =
        document.getElementById(
            "msg"
        );


    payBtn.disabled =
        true;


    msg.className =
        "muted";


    msg.textContent =
        "Creating secure Razorpay order...";


    try {

        const response =
            await fetch(
                "/api/create-order",
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Could not create payment order."
            );

        }


        if (!data.success) {

            throw new Error(
                data.error ||
                "Payment order creation failed."
            );

        }


        /* ==================================================
           RAZORPAY
           ================================================== */

        const options = {

            key:
                data.key_id,

            amount:
                data.amount,

            currency:
                data.currency,

            name:
                "AXM Automatic Xerox Machine",

            description:
                "Printing - " +
                job.filename,

            order_id:
                data.orderId,


            handler:
                async function(
                    razorpayResponse
                ) {

                    try {

                        msg.className =
                            "muted";


                        msg.textContent =
                            "Verifying payment securely...";


                        const verifyResponse =
                            await fetch(
                                "/api/verify-payment",
                                {

                                    method:
                                        "POST",

                                    headers: {

                                        "Content-Type":
                                            "application/json"

                                    },

                                    body:
                                        JSON.stringify(
                                            razorpayResponse
                                        )

                                }
                            );


                        const verified =
                            await verifyResponse.json();


                        if (
                            !verifyResponse.ok ||
                            !verified.success
                        ) {

                            throw new Error(
                                verified.error ||
                                "Payment verification failed."
                            );

                        }


                        msg.className =
                            "success";


                        msg.textContent =
                            "Payment successful. Starting print...";


                        await startPrinting(
                            verified.job.id
                        );

                    }

                    catch (error) {

                        console.error(
                            error
                        );


                        msg.className =
                            "error";


                        msg.textContent =
                            error.message ||
                            "Payment verification failed.";


                        payBtn.disabled =
                            false;

                    }

                },


            modal: {

                ondismiss:
                    function() {

                        payBtn.disabled =
                            false;


                        msg.className =
                            "error";


                        msg.textContent =
                            "Payment window closed.";

                    }

            },


            theme: {

                color:
                    "#0b57d0"

            }

        };


        const razorpay =
            new Razorpay(
                options
            );


        razorpay.on(
            "payment.failed",
            function(response) {

                console.error(
                    "Payment failed:",
                    response
                );


                msg.className =
                    "error";


                msg.textContent =
                    "Payment failed: " +
                    (
                        response.error?.description ||
                        "Please try again."
                    );


                payBtn.disabled =
                    false;

            }
        );


        razorpay.open();

    }

    catch (error) {

        console.error(
            error
        );


        msg.className =
            "error";


        msg.textContent =
            error.message ||
            "Unable to start payment.";


        payBtn.disabled =
            false;

    }

}


/* ============================================================
   START PRINTING
   ============================================================ */

async function startPrinting(jobId) {

    const msg =
        document.getElementById(
            "msg"
        );


    try {

        const response =
            await fetch(
                "/api/print",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({
                            jobId:
                                jobId
                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Print start failed."
            );

        }


        msg.className =
            "success";


        msg.textContent =
            "Payment successful. Printing started.";

    }

    catch (error) {

        console.error(
            error
        );


        msg.className =
            "error";


        msg.textContent =
            error.message ||
            "Unable to start printing.";

    }

}


/* ============================================================
   TEST PAYMENT
   ============================================================ */

async function testPay() {

    const msg =
        document.getElementById(
            "msg"
        );


    try {

        msg.className =
            "muted";


        msg.textContent =
            "Testing payment...";


        const response =
            await fetch(
                "/api/test-payment",
                {
                    method:
                        "POST"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Test payment failed."
            );

        }


        msg.className =
            "success";


        msg.textContent =
            "Test payment successful.";


        await startPrinting(
            data.job.id
        );

    }

    catch (error) {

        console.error(
            error
        );


        msg.className =
            "error";


        msg.textContent =
            error.message ||
            "Test payment failed.";

    }

}


/* ============================================================
   START
   ============================================================ */

load();

</script>

</body>

</html>
