<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>AXM — Payment</title>

    <link rel="stylesheet" href="/style.css">

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>

        /* =========================================
           PAYMENT PAGE
           ========================================= */

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;

            overflow-x: hidden;
            overflow-y: auto;
        }

        body {
            background: #eef7ff;
            font-family: Arial, sans-serif;
            color: #06427f;
        }


        /* =========================================
           MAIN
           ========================================= */

        main {
            width: 100%;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            padding: 20px 0 40px;

            box-sizing: border-box;
        }


        /* =========================================
           PAYMENT PANEL
           ========================================= */

        .panel {
            width: 90%;
            max-width: 760px;

            background: white;

            border-radius: 20px;

            padding: 28px;

            box-sizing: border-box;

            text-align: center;

            box-shadow:
                0 8px 30px
                rgba(0, 60, 120, 0.10);
        }


        /* =========================================
           TITLE
           ========================================= */

        .panel > h1 {
            margin: 0 0 8px;

            font-size: 32px;

            font-weight: 800;

            color: #08477f;
        }


        /* =========================================
           SUMMARY
           ========================================= */

        #summary {
            width: 100%;

            text-align: center;

            margin: 0 auto;
        }


        /* FILE NAME */

        #summary > p {
            margin: 0 0 14px;

            font-weight: 700;

            font-size: 15px;
        }


        /* =========================================
           SUMMARY CARD
           ========================================= */

        .summary-card {

            width: 100%;

            max-width: 430px;

            margin: 0 auto 18px;

            background: #f3f7fc;

            border: 1px solid #dbe8f5;

            border-radius: 15px;

            padding: 15px 22px;

            box-sizing: border-box;
        }


        /* SUMMARY ROW */

        .summary-card div {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin: 7px 0;

            padding: 0;

            font-size: 15px;

            line-height: 1.3;
        }


        /* LEFT SIDE */

        .summary-card div b {
            text-align: left;
        }


        /* RIGHT SIDE */

        .summary-card div span {

            text-align: right;

            font-weight: 600;
        }


        /* =========================================
           TOTAL AMOUNT
           ========================================= */

        #summary > h2 {

            margin: 10px 0 20px;

            font-size: 18px;

            color: #58708c;
        }


        /* =========================================
           PAYMENT BOX
           ========================================= */

        .payment-box {

            width: 100%;

            max-width: 500px;

            margin: 0 auto;

            padding: 22px 20px 25px;

            border: 2px dashed #d5dfed;

            border-radius: 18px;

            text-align: center;

            box-sizing: border-box;
        }


        /* =========================================
           SCAN & PAY
           ========================================= */

        .payment-box h2 {

            margin: 0 0 8px;

            font-size: 25px;

            color: #06427f;
        }


        /* =========================================
           HELP TEXT
           ========================================= */

        #paymentHelp {

            margin: 0 0 15px;

            font-size: 14px;

            color: #52708f;
        }


        /* =========================================
           QR PLACEHOLDER
           ========================================= */

        .fake-qr {

            width: 180px;

            height: 180px;

            margin: 12px auto 18px;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            background:
                repeating-linear-gradient(
                    45deg,
                    #111 0px,
                    #111 8px,
                    #fff 8px,
                    #fff 16px
                );

            color: white;

            font-weight: 800;

            font-size: 17px;

            box-sizing: border-box;
        }


        /* =========================================
           PAY BUTTON
           ========================================= */

        .button {

            width: 100%;

            max-width: 330px;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background: #f5c400;

            color: #062b55;

            font-weight: 800;

            font-size: 16px;

            cursor: pointer;

            display: block;

            margin: 0 auto;
        }


        .button:hover {

            filter: brightness(0.96);
        }


        .button:disabled {

            opacity: 0.5;

            cursor: not-allowed;
        }


        /* =========================================
           SECONDARY BUTTON
           ========================================= */

        .secondary {

            margin: 12px auto 0;

            background: white;

            border: 2px solid #2864ff;

            color: #2864ff;
        }


        /* =========================================
           MESSAGE
           ========================================= */

        #msg {

            margin: 14px 0 0;

            text-align: center;

            font-size: 14px;
        }


        .success {

            color: #12833b;

            font-weight: 700;
        }


        .error {

            color: #dc2626;

            font-weight: 700;
        }


        .muted {

            color: #52708f;
        }


        /* =========================================
           MOBILE
           ========================================= */

        @media (max-width: 600px) {

            main {

                padding: 10px 0 30px;
            }


            .panel {

                width: 94%;

                padding: 20px 15px;

                border-radius: 16px;
            }


            .panel > h1 {

                font-size: 27px;
            }


            .summary-card {

                max-width: 100%;

                padding: 14px 18px;
            }


            .payment-box {

                max-width: 100%;

                padding: 20px 12px 22px;
            }


            .fake-qr {

                width: 160px;

                height: 160px;
            }

        }

    </style>

</head>


<body>


<main>


    <section class="panel">


        <!-- =====================================
             TITLE
             ===================================== -->

        <h1>
            UPI Payment
        </h1>


        <!-- =====================================
             JOB SUMMARY
             ===================================== -->

        <div id="summary">
            Loading...
        </div>


        <!-- =====================================
             PAYMENT
             ===================================== -->

        <div class="payment-box">


            <h2>
                Scan &amp; Pay
            </h2>


            <p id="paymentHelp">
                Click PAY NOW to open secure Razorpay Checkout.
            </p>


            <div
                class="fake-qr"
                id="qrPlaceholder"
            >
                RAZORPAY<br>
                PAYMENT
            </div>


            <button
                id="payBtn"
                class="button"
                onclick="startPayment()"
                disabled
            >
                PAY NOW
            </button>


            <button
                id="testBtn"
                class="button secondary"
                onclick="testPay()"
                style="display:none"
            >
                TEST PAYMENT → PRINT
            </button>


        </div>


        <!-- =====================================
             MESSAGE
             ===================================== -->

        <p
            id="msg"
            class="muted"
        ></p>


    </section>


</main>



<script>


/* =========================================
   CURRENT JOB
   ========================================= */

let job = null;



/* =========================================
   ESCAPE HTML
   ========================================= */

function esc(value) {

    return String(
        value ?? ""
    ).replace(
        /[&<>'"]/g,
        function(c) {

            return {

                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                "'": "&#39;",
                '"': "&quot;"

            }[c];

        }
    );

}



/* =========================================
   LOAD JOB
   ========================================= */

async function load() {

    const msg =
        document.getElementById("msg");


    try {

        const response =
            await fetch("/api/job");


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Unable to load job."
            );

        }


        job =
            data.job;


        if (!job) {

            msg.className =
                "error";

            msg.textContent =
                "No document has been received yet.";

            return;

        }



        /* =====================================
           JOB INFORMATION
           ===================================== */

        const colorText =
            job.colour ||
            job.color ||
            "Black & White";


        const sidesText =
            job.sides ||
            "Single Side";


        const pages =
            Math.max(
                1,
                Number(job.pages) || 1
            );


        const copies =
            Math.max(
                1,
                Number(job.copies) || 1
            );



        /* =====================================
           DISPLAY SUMMARY
           ===================================== */

        document.querySelector(
            "#summary"
        ).innerHTML = `

            <p>
                <b>${esc(job.filename)}</b>
            </p>


            <div class="summary-card">


                <div>
                    <b>Colour</b>

                    <span>
                        ${esc(colorText)}
                    </span>
                </div>


                <div>
                    <b>Sides</b>

                    <span>
                        ${esc(sidesText)}
                    </span>
                </div>


                <div>
                    <b>Pages</b>

                    <span>
                        ${pages}
                    </span>
                </div>


                <div>
                    <b>Copies</b>

                    <span>
                        ${copies}
                    </span>
                </div>


            </div>


            <h2>

                Total Amount<br>

                <strong style="
                    display:block;
                    margin-top:4px;
                    font-size:34px;
                    color:#08477f;
                ">
                    ₹${Number(job.amount || 0).toFixed(2)}
                </strong>

            </h2>

        `;



        /* =====================================
           CHECK RAZORPAY
           ===================================== */

        const healthResponse =
            await fetch("/api/health");


        const health =
            await healthResponse.json();


        const payBtn =
            document.getElementById("payBtn");


        const testBtn =
            document.getElementById("testBtn");


        const qr =
            document.getElementById("qrPlaceholder");



        if (
            health.razorpayConfigured
        ) {

            payBtn.disabled =
                false;


            testBtn.style.display =
                "none";


            qr.innerHTML =
                "CLICK PAY<br>TO CONTINUE";


            msg.className =
                "success";


            msg.textContent =
                "Razorpay is ready.";

        }

        else {

            payBtn.disabled =
                true;


            testBtn.style.display =
                "none";


            qr.innerHTML =
                "RAZORPAY<br>NOT CONFIGURED";


            msg.className =
                "error";


            msg.textContent =
                "Razorpay is not configured on the server.";

        }

    }

    catch (error) {

        console.error(error);


        msg.className =
            "error";


        msg.textContent =
            error.message ||
            "Unable to load payment information.";

    }

}



/* =========================================
   REAL RAZORPAY PAYMENT
   ========================================= */

async function startPayment() {


    if (!job) {

        alert(
            "No document has been received."
        );

        return;

    }


    const payBtn =
        document.getElementById("payBtn");


    const msg =
        document.getElementById("msg");


    payBtn.disabled =
        true;


    msg.className =
        "muted";


    msg.textContent =
        "Creating secure Razorpay order...";



    try {


        /* =====================================
           CREATE ORDER
           ===================================== */

        const response =
            await fetch(
                "/api/create-order",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    }
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Could not create payment order."
            );

        }


        if (!data.success) {

            throw new Error(
                data.error ||
                "Payment order creation failed."
            );

        }


        console.log(
            "Razorpay order:",
            data.orderId
        );



        /* =====================================
           RAZORPAY OPTIONS
           ===================================== */

        const options = {

            key:
                data.key_id,


            amount:
                data.amount,


            currency:
                data.currency,


            name:
                "AXM Automatic Xerox Machine",


            description:
                "Printing - " +
                job.filename,


            order_id:
                data.orderId,


            handler:
                async function(
                    razorpayResponse
                ) {


                    try {


                        msg.className =
                            "muted";


                        msg.textContent =
                            "Verifying payment securely...";



                        /* =========================
                           VERIFY PAYMENT
                           ========================= */

                        const verifyResponse =
                            await fetch(
                                "/api/verify-payment",
                                {
                                    method:
                                        "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify(
                                            razorpayResponse
                                        )
                                }
                            );


                        const verified =
                            await verifyResponse.json();


                        if (
                            !verifyResponse.ok ||
                            !verified.success
                        ) {

                            throw new Error(
                                verified.error ||
                                "Payment verification failed."
                            );

                        }



                        msg.className =
                            "success";


                        msg.textContent =
                            "✓ Payment successful. Starting print...";



                        /* =========================
                           START PRINT
                           ========================= */

                        await startPrinting(
                            verified.job.id
                        );


                    }

                    catch (error) {

                        console.error(
                            error
                        );


                        msg.className =
                            "error";


                        msg.textContent =
                            error.message ||
                            "Payment verification failed.";


                        payBtn.disabled =
                            false;

                    }

                },


            modal: {

                ondismiss:
                    function() {

                        payBtn.disabled =
                            false;


                        msg.className =
                            "error";


                        msg.textContent =
                            "Payment window closed.";

                    }

            },


            theme: {

                color:
                    "#0b57d0"

            }

        };



        /* =====================================
           OPEN RAZORPAY
           ===================================== */

        const razorpay =
            new Razorpay(
                options
            );


        razorpay.on(
            "payment.failed",
            function(response) {

                console.error(
                    "Payment failed:",
                    response
                );


                msg.className =
                    "error";


                msg.textContent =
                    "Payment failed: " +
                    (
                        response.error?.description ||
                        "Please try again."
                    );


                payBtn.disabled =
                    false;

            }
        );


        razorpay.open();


    }

    catch (error) {

        console.error(error);


        msg.className =
            "error";


        msg.textContent =
            error.message ||
            "Unable to start payment.";


        payBtn.disabled =
            false;

    }

}



/* =========================================
   START PRINTING
   ========================================= */

async function startPrinting(
    jobId
) {


    const msg =
        document.getElementById("msg");


    try {


        const response =
            await fetch(
                "/api/print",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            jobId:
                                jobId
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Print start failed."
            );

        }


        msg.className =
            "success";


        msg.textContent =
            "✓ Payment successful. Printing started.";


        console.log(
            "PRINT STARTED:",
            data
        );


    }

    catch (error) {

        console.error(error);


        msg.className =
            "error";


        msg.textContent =
            error.message ||
            "Unable to start printing.";

    }

}



/* =========================================
   TEST PAYMENT
   ========================================= */

async function testPay() {


    const msg =
        document.getElementById("msg");


    try {


        msg.className =
            "muted";


        msg.textContent =
            "Testing payment...";


        const response =
            await fetch(
                "/api/test-payment",
                {
                    method: "POST"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Test payment failed."
            );

        }


        msg.className =
            "success";


        msg.textContent =
            "Test payment successful.";


        await startPrinting(
            data.job.id
        );


    }

    catch (error) {

        console.error(error);


        msg.className =
            "error";


        msg.textContent =
            error.message ||
            "Test payment failed.";

    }

}



/* =========================================
   START PAGE
   ========================================= */

load();

</script>


</body>

</html>
