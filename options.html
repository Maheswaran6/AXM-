<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NIET AXM — Print Options</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #eef6fc;
            color: #123b70;
        }

        /* =====================================================
           MAIN
        ===================================================== */

        main {
            width: 100%;
            height: 100vh;
            height: 100svh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 10px;
        }


        /* =====================================================
           PANEL
        ===================================================== */

        .panel {
            width: 100%;
            max-width: 900px;

            background: #ffffff;

            border-radius: 20px;

            padding: 15px 25px 18px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.10);
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .college-logo {
            display: block;

            width: 55px;
            height: 55px;

            object-fit: contain;

            margin: 0 auto 2px;
        }


        /* =====================================================
           TITLE
        ===================================================== */

        h1 {
            text-align: center;

            margin: 0;

            font-size: 30px;

            line-height: 1.1;

            color: #123f7a;
        }


        .subtitle {
            text-align: center;

            margin: 3px 0 10px;

            font-size: 14px;

            color: #66809d;
        }


        /* =====================================================
           DOCUMENT
        ===================================================== */

        .document-box {
            background: #edf7ff;

            border: 2px solid #cfe7fa;

            border-radius: 12px;

            padding: 9px 14px;

            text-align: center;

            margin-bottom: 10px;
        }


        .document-name {
            font-size: 16px;

            font-weight: bold;

            line-height: 1.2;

            word-break: break-word;
        }


        .page-count {
            margin-top: 3px;

            font-size: 19px;

            font-weight: bold;

            color: #1769e0;
        }


        /* =====================================================
           SECTION
        ===================================================== */

        .section {
            margin-top: 9px;
        }


        .section-title {
            font-size: 17px;

            font-weight: bold;

            margin-bottom: 5px;
        }


        /* =====================================================
           OPTIONS
        ===================================================== */

        .options {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 9px;
        }


        .option-button {
            width: 100%;

            height: 55px;

            border: 2px solid #ccdbea;

            border-radius: 11px;

            background: #ffffff;

            color: #123b70;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.15s,
                border-color 0.15s,
                color 0.15s;
        }


        .option-button:hover {
            border-color: #1769e0;
        }


        .option-button.selected {
            background: #1769e0;

            border-color: #1769e0;

            color: #ffffff;

            box-shadow:
                0 5px 14px
                rgba(23, 105, 224, 0.22);
        }


        /* =====================================================
           AMOUNT
        ===================================================== */

        .amount-box {
            margin-top: 12px;

            padding: 10px 15px;

            border-radius: 13px;

            background: #f5f9fd;

            text-align: center;
        }


        .amount-label {
            font-size: 15px;

            font-weight: bold;
        }


        .amount {
            margin-top: 1px;

            font-size: 34px;

            line-height: 1.1;

            font-weight: bold;

            color: #123f7a;
        }


        .summary {
            margin-top: 2px;

            color: #607d9b;

            font-size: 13px;

            line-height: 1.2;
        }


        /* =====================================================
           CONTINUE
        ===================================================== */

        .continue-button {
            width: 100%;

            margin-top: 10px;

            height: 50px;

            border: none;

            border-radius: 11px;

            background: #f4c51b;

            color: #123b70;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }


        .continue-button:hover {
            background: #e9b900;
        }


        .continue-button:disabled {
            opacity: 0.6;

            cursor: not-allowed;
        }


        /* =====================================================
           MESSAGE
        ===================================================== */

        #message {
            height: 18px;

            margin-top: 5px;

            text-align: center;

            font-size: 13px;

            font-weight: bold;
        }


        .success {
            color: #079447;
        }


        .error {
            color: #d92727;
        }


        .loading {
            color: #1769e0;
        }


        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 700px) {

            main {
                padding: 7px;
            }

            .panel {
                padding: 13px 16px 15px;

                border-radius: 17px;
            }

            .college-logo {
                width: 48px;
                height: 48px;
            }

            h1 {
                font-size: 27px;
            }

            .subtitle {
                font-size: 13px;

                margin-bottom: 8px;
            }

            .document-box {
                padding: 8px 10px;

                margin-bottom: 8px;
            }

            .document-name {
                font-size: 14px;
            }

            .page-count {
                font-size: 17px;
            }

            .section {
                margin-top: 7px;
            }

            .section-title {
                font-size: 15px;

                margin-bottom: 4px;
            }

            .options {
                gap: 7px;
            }

            .option-button {
                height: 50px;

                font-size: 14px;
            }

            .amount-box {
                margin-top: 9px;

                padding: 8px;
            }

            .amount {
                font-size: 30px;
            }

            .summary {
                font-size: 12px;
            }

            .continue-button {
                height: 47px;

                margin-top: 8px;

                font-size: 16px;
            }
        }


        /* =====================================================
           VERY SMALL SCREENS
        ===================================================== */

        @media (max-height: 650px) {

            .panel {
                padding-top: 8px;
                padding-bottom: 10px;
            }

            .college-logo {
                width: 40px;
                height: 40px;
            }

            h1 {
                font-size: 24px;
            }

            .subtitle {
                margin-bottom: 5px;
            }

            .document-box {
                padding: 6px 10px;
            }

            .section {
                margin-top: 5px;
            }

            .option-button {
                height: 45px;
            }

            .amount-box {
                margin-top: 7px;
                padding: 6px;
            }

            .amount {
                font-size: 27px;
            }

            .continue-button {
                height: 43px;
            }

        }

    </style>

</head>


<body>

<main>

    <section class="panel">

        <!-- LOGO -->

        <img
            src="/niet-logo.png"
            class="college-logo"
            alt="NIET Logo"
        >


        <!-- TITLE -->

        <h1>
            Print Options
        </h1>


        <p class="subtitle">
            NIET AXM — Automated Xerox Machine
        </p>


        <!-- DOCUMENT -->

        <div class="document-box">

            <div
                id="documentName"
                class="document-name"
            >
                Detecting document...
            </div>

            <div
                id="pageCount"
                class="page-count"
            >
                Detecting pages...
            </div>

        </div>


        <!-- COLOUR -->

        <div class="section">

            <div class="section-title">
                1. Select Print Colour
            </div>

            <div class="options">

                <button
                    id="bwButton"
                    class="option-button selected"
                    type="button"
                    onclick="selectColour('Black & White')"
                >
                    Black &amp; White
                </button>


                <button
                    id="colourButton"
                    class="option-button"
                    type="button"
                    onclick="selectColour('Colour')"
                >
                    Colour
                </button>

            </div>

        </div>


        <!-- SIDES -->

        <div class="section">

            <div class="section-title">
                2. Select Printing Side
            </div>

            <div class="options">

                <button
                    id="singleButton"
                    class="option-button selected"
                    type="button"
                    onclick="selectSides('Single Side')"
                >
                    Single Side
                </button>


                <button
                    id="doubleButton"
                    class="option-button"
                    type="button"
                    onclick="selectSides('Double Side')"
                >
                    Double Side
                </button>

            </div>

        </div>


        <!-- AMOUNT -->

        <div class="amount-box">

            <div class="amount-label">
                Total Printing Amount
            </div>

            <div
                id="amount"
                class="amount"
            >
                ₹0
            </div>

            <div
                id="summary"
                class="summary"
            >
                Calculating...
            </div>

        </div>


        <!-- CONTINUE -->

        <button
            id="continueButton"
            class="continue-button"
            type="button"
            onclick="continueToPayment()"
            disabled
        >
            CONTINUE TO PAYMENT
        </button>


        <div id="message"></div>

    </section>

</main>


<script>

let selectedColour = "Black & White";

let selectedSides = "Single Side";

let detectedPages = 0;

let currentAmount = 0;


/* ============================================================
   LOAD JOB
============================================================ */

async function loadJob() {

    const message =
        document.getElementById("message");


    try {

        const response =
            await fetch(
                "/api/current-job",
                {
                    cache: "no-store"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success ||
            !data.job
        ) {

            throw new Error(
                "No document found. Please upload a document first."
            );

        }


        const job = data.job;


        /* DOCUMENT NAME */

        document.getElementById(
            "documentName"
        ).textContent =
            job.filename ||
            "Document";


        /* PAGE COUNT */

        detectedPages =
            Number(job.pages);


        if (
            !Number.isFinite(detectedPages) ||
            detectedPages < 1
        ) {

            throw new Error(
                "Unable to detect document pages."
            );

        }


        detectedPages =
            Math.floor(detectedPages);


        document.getElementById(
            "pageCount"
        ).textContent =
            detectedPages +
            (
                detectedPages === 1
                    ? " PAGE DETECTED"
                    : " PAGES DETECTED"
            );


        /* ENABLE BUTTON */

        document.getElementById(
            "continueButton"
        ).disabled = false;


        calculateAmount();

    }


    catch (error) {

        console.error(
            "JOB ERROR:",
            error
        );


        message.className =
            "error";


        message.textContent =
            error.message ||
            "Unable to load document.";

    }

}


/* ============================================================
   COLOUR
============================================================ */

function selectColour(value) {

    selectedColour =
        value;


    document
        .getElementById("bwButton")
        .classList.toggle(
            "selected",
            value === "Black & White"
        );


    document
        .getElementById("colourButton")
        .classList.toggle(
            "selected",
            value === "Colour"
        );


    calculateAmount();

}


/* ============================================================
   SIDES
============================================================ */

function selectSides(value) {

    selectedSides =
        value;


    document
        .getElementById("singleButton")
        .classList.toggle(
            "selected",
            value === "Single Side"
        );


    document
        .getElementById("doubleButton")
        .classList.toggle(
            "selected",
            value === "Double Side"
        );


    calculateAmount();

}


/* ============================================================
   PRICE CALCULATION
============================================================ */

function getRate() {

    if (
        selectedColour === "Black & White" &&
        selectedSides === "Single Side"
    ) {

        return 3;

    }


    if (
        selectedColour === "Black & White" &&
        selectedSides === "Double Side"
    ) {

        return 1.80;

    }


    if (
        selectedColour === "Colour" &&
        selectedSides === "Single Side"
    ) {

        return 5;

    }


    if (
        selectedColour === "Colour" &&
        selectedSides === "Double Side"
    ) {

        return 10;

    }


    return 3;

}


/* ============================================================
   CALCULATE AMOUNT
============================================================ */

function calculateAmount() {

    if (detectedPages < 1) {
        return;
    }


    const rate =
        getRate();


    currentAmount =
        detectedPages * rate;


    currentAmount =
        Math.round(
            currentAmount * 100
        ) / 100;


    document.getElementById(
        "amount"
    ).textContent =
        "₹" +
        currentAmount.toFixed(2);


    document.getElementById(
        "summary"
    ).textContent =
        selectedColour +
        " • " +
        selectedSides +
        " • " +
        detectedPages +
        (
            detectedPages === 1
                ? " page"
                : " pages"
        ) +
        " • ₹" +
        rate.toFixed(2) +
        " per page";

}


/* ============================================================
   CONTINUE TO PAYMENT
============================================================ */

async function continueToPayment() {

    const button =
        document.getElementById(
            "continueButton"
        );


    const message =
        document.getElementById(
            "message"
        );


    if (detectedPages < 1) {

        message.className =
            "error";


        message.textContent =
            "Page count has not been detected.";


        return;

    }


    button.disabled = true;


    message.className =
        "loading";


    message.textContent =
        "Preparing payment...";


    try {

        const response =
            await fetch(
                "/api/options",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        colour:
                            selectedColour,

                        sides:
                            selectedSides,

                        pages:
                            detectedPages,

                        copies:
                            1

                    })

                }
            );


        const text =
            await response.text();


        let result;


        try {

            result =
                JSON.parse(text);

        }

        catch {

            throw new Error(
                "Server returned an invalid response."
            );

        }


        if (
            !response.ok ||
            !result.success
        ) {

            throw new Error(
                result.error ||
                "Unable to save print options."
            );

        }


        /* SAVE JOB */

        if (result.job) {

            sessionStorage.setItem(
                "axmJob",
                JSON.stringify(
                    result.job
                )
            );

        }


        message.className =
            "success";


        message.textContent =
            "Options saved. Opening payment...";


        setTimeout(
            function () {

                window.location.href =
                    "/payment.html";

            },
            350
        );

    }


    catch (error) {

        console.error(
            "OPTIONS ERROR:",
            error
        );


        message.className =
            "error";


        message.textContent =
            error.message ||
            "Unable to continue.";


        button.disabled = false;

    }

}


/* ============================================================
   START
============================================================ */

loadJob();

</script>

</body>

</html>
