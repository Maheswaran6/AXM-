<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NIET AXM — Print Options</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            overflow-y: auto;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #eef6fc;
            color: #123b70;
            overflow-y: auto;
        }

        /* =====================================================
           MAIN PAGE
           ===================================================== */

        main {
            width: 100%;
            display: flex;
            align-items: flex-start;
            justify-content: center;

            /*
             * Important:
             * Do NOT use min-height: 100vh here.
             * It was making the layout unnecessarily tall.
             */
            padding: 12px 20px 35px;
        }


        /* =====================================================
           MAIN PANEL
           ===================================================== */

        .panel {
            width: 100%;
            max-width: 900px;

            background: white;

            border-radius: 22px;

            /*
             * Reduced padding so the top sections
             * fit better on one screen.
             */
            padding: 20px 30px 30px;

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.10);
        }


        /* =====================================================
           COLLEGE LOGO
           ===================================================== */

        .college-logo {
            display: block;

            width: 65px;
            height: 65px;

            object-fit: contain;

            margin: 0 auto 5px;
        }


        /* =====================================================
           TITLE
           ===================================================== */

        h1 {
            text-align: center;

            margin: 3px 0;

            font-size: 32px;

            color: #123f7a;
        }


        .subtitle {
            text-align: center;

            color: #66809d;

            margin:
                3px 0 15px;

            font-size: 15px;
        }


        /* =====================================================
           DOCUMENT BOX
           ===================================================== */

        .document-box {

            background: #edf7ff;

            border:
                2px solid #cfe7fa;

            border-radius: 14px;

            padding: 12px 15px;

            text-align: center;

            margin-bottom: 16px;
        }


        .document-name {

            font-size: 17px;

            font-weight: bold;

            word-break: break-word;
        }


        .page-count {

            margin-top: 5px;

            font-size: 21px;

            font-weight: bold;

            color: #1769e0;
        }


        /* =====================================================
           SECTIONS
           ===================================================== */

        .section {

            margin-top: 14px;
        }


        .section-title {

            font-size: 18px;

            font-weight: bold;

            margin-bottom: 8px;
        }


        /* =====================================================
           OPTION BUTTONS
           ===================================================== */

        .options {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 12px;
        }


        .option-button {

            min-height: 68px;

            border:
                2px solid #ccdbea;

            border-radius: 13px;

            background: white;

            color: #123b70;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition:
                0.2s;
        }


        .option-button:hover {

            border-color:
                #1769e0;
        }


        .option-button.selected {

            background:
                #1769e0;

            border-color:
                #1769e0;

            color: white;

            box-shadow:
                0 6px 18px
                rgba(23, 105, 224, 0.25);
        }


        /* =====================================================
           AMOUNT BOX
           ===================================================== */

        .amount-box {

            margin-top: 22px;

            padding: 20px;

            border-radius: 16px;

            background: #f5f9fd;

            text-align: center;
        }


        .amount-label {

            font-size: 17px;

            font-weight: bold;
        }


        .amount {

            margin-top: 5px;

            font-size: 40px;

            font-weight: bold;

            color: #123f7a;
        }


        .summary {

            margin-top: 5px;

            color: #607d9b;

            font-size: 15px;
        }


        /* =====================================================
           CONTINUE BUTTON
           ===================================================== */

        .continue-button {

            width: 100%;

            margin-top: 18px;

            padding: 16px;

            border: none;

            border-radius: 13px;

            background: #f4c51b;

            color: #123b70;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;
        }


        .continue-button:hover {

            background:
                #e9b900;
        }


        .continue-button:disabled {

            opacity: 0.6;

            cursor:
                not-allowed;
        }


        /* =====================================================
           MESSAGE
           ===================================================== */

        #message {

            min-height: 22px;

            margin-top: 12px;

            text-align: center;

            font-weight: bold;
        }


        .success {
            color: #079447;
        }


        .error {
            color: #d92727;
        }


        .loading {
            color: #1769e0;
        }


        /* =====================================================
           TABLET
           ===================================================== */

        @media (max-width: 800px) {

            main {
                padding:
                    10px 12px 30px;
            }

            .panel {
                padding:
                    18px 22px 28px;
            }

            .college-logo {
                width: 60px;
                height: 60px;
            }

            h1 {
                font-size: 29px;
            }

            .section-title {
                font-size: 17px;
            }

            .option-button {
                min-height: 64px;
                font-size: 16px;
            }

        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 600px) {

            main {
                padding:
                    8px 8px 25px;
            }


            .panel {

                border-radius: 18px;

                padding:
                    15px 14px 25px;
            }


            .college-logo {

                width: 55px;
                height: 55px;

                margin-bottom: 2px;
            }


            h1 {

                font-size: 26px;
            }


            .subtitle {

                font-size: 13px;

                margin-bottom: 12px;
            }


            .document-box {

                padding: 11px;

                margin-bottom: 13px;
            }


            .document-name {

                font-size: 15px;
            }


            .page-count {

                font-size: 19px;
            }


            .section {

                margin-top: 12px;
            }


            .section-title {

                font-size: 16px;

                margin-bottom: 7px;
            }


            .options {

                gap: 8px;
            }


            .option-button {

                min-height: 60px;

                font-size: 15px;

                border-radius: 11px;
            }


            .amount-box {

                margin-top: 18px;

                padding: 17px;
            }


            .amount {

                font-size: 36px;
            }


            .continue-button {

                padding: 15px;

                font-size: 17px;
            }

        }


        /* =====================================================
           VERY SMALL SCREEN
           ===================================================== */

        @media (max-height: 700px) and (min-width: 601px) {

            main {
                padding-top: 6px;
            }


            .panel {
                padding:
                    12px 25px 25px;
            }


            .college-logo {

                width: 50px;
                height: 50px;
            }


            h1 {

                font-size: 27px;
            }


            .subtitle {

                margin-bottom: 9px;
            }


            .document-box {

                padding: 9px;

                margin-bottom: 10px;
            }


            .section {

                margin-top: 9px;
            }


            .option-button {

                min-height: 55px;
            }

        }

    </style>

</head>


<body>

<main>

<section class="panel">

    <!-- =====================================================
         LOGO
         ===================================================== -->

    <img
        src="/niet-logo.png"
        class="college-logo"
        alt="NIET Logo"
    >


    <!-- =====================================================
         TITLE
         ===================================================== -->

    <h1>
        Print Options
    </h1>


    <p class="subtitle">
        NIET AXM — Automated Xerox Machine
    </p>


    <!-- =====================================================
         DOCUMENT
         ===================================================== -->

    <div class="document-box">

        <div
            id="documentName"
            class="document-name"
        >
            Detecting document...
        </div>


        <div
            id="pageCount"
            class="page-count"
        >
            Detecting pages...
        </div>

    </div>


    <!-- =====================================================
         1. COLOUR
         ===================================================== -->

    <div class="section">

        <div class="section-title">
            1. Select Print Colour
        </div>


        <div class="options">

            <button
                id="bwButton"
                class="option-button selected"
                type="button"
                onclick="selectColour('Black & White')"
            >
                ⚫<br>
                Black &amp; White
            </button>


            <button
                id="colourButton"
                class="option-button"
                type="button"
                onclick="selectColour('Colour')"
            >
                🌈<br>
                Colour
            </button>

        </div>

    </div>


    <!-- =====================================================
         2. SIDES
         ===================================================== -->

    <div class="section">

        <div class="section-title">
            2. Select Printing Side
        </div>


        <div class="options">

            <button
                id="singleButton"
                class="option-button selected"
                type="button"
                onclick="selectSides('Single Side')"
            >
                📄<br>
                Single Side
            </button>


            <button
                id="doubleButton"
                class="option-button"
                type="button"
                onclick="selectSides('Double Side')"
            >
                📑<br>
                Double Side
            </button>

        </div>

    </div>


    <!-- =====================================================
         AMOUNT
         ===================================================== -->

    <div class="amount-box">

        <div class="amount-label">
            Total Printing Amount
        </div>


        <div
            id="amount"
            class="amount"
        >
            ₹0
        </div>


        <div
            id="summary"
            class="summary"
        >
            Calculating...
        </div>

    </div>


    <!-- =====================================================
         CONTINUE
         ===================================================== -->

    <button
        id="continueButton"
        class="continue-button"
        type="button"
        onclick="continueToPayment()"
        disabled
    >
        CONTINUE TO PAYMENT
    </button>


    <div id="message"></div>

</section>

</main>


<script>

/* ============================================================
   CURRENT SELECTION
   ============================================================ */

let selectedColour =
    "Black & White";

let selectedSides =
    "Single Side";

let detectedPages = 0;

let currentAmount = 0;


/* ============================================================
   LOAD CURRENT JOB
   ============================================================ */

async function loadJob() {

    const message =
        document.getElementById("message");


    try {

        const response =
            await fetch(
                "/api/current-job",
                {
                    cache: "no-store"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success ||
            !data.job
        ) {

            throw new Error(
                "No document found."
            );

        }


        const job =
            data.job;


        /* -----------------------------------------------
           DOCUMENT NAME
           ----------------------------------------------- */

        document.getElementById(
            "documentName"
        ).textContent =
            job.filename ||
            "Document";


        /* -----------------------------------------------
           PAGE COUNT
           ----------------------------------------------- */

        detectedPages =
            Number(job.pages);


        if (
            !Number.isFinite(
                detectedPages
            ) ||
            detectedPages < 1
        ) {

            throw new Error(
                "Unable to detect PDF pages."
            );

        }


        detectedPages =
            Math.floor(
                detectedPages
            );


        document.getElementById(
            "pageCount"
        ).textContent =
            detectedPages +
            (
                detectedPages === 1
                    ? " PAGE DETECTED"
                    : " PAGES DETECTED"
            );


        /* -----------------------------------------------
           ENABLE CONTINUE
           ----------------------------------------------- */

        document.getElementById(
            "continueButton"
        ).disabled = false;


        calculateAmount();


    }

    catch (error) {

        console.error(
            "JOB ERROR:",
            error
        );


        message.className =
            "error";


        message.textContent =
            error.message ||
            "Unable to load document.";

    }

}


/* ============================================================
   SELECT COLOUR
   ============================================================ */

function selectColour(value) {

    selectedColour =
        value;


    document
        .getElementById(
            "bwButton"
        )
        .classList.toggle(
            "selected",
            value ===
                "Black & White"
        );


    document
        .getElementById(
            "colourButton"
        )
        .classList.toggle(
            "selected",
            value ===
                "Colour"
        );


    calculateAmount();

}


/* ============================================================
   SELECT SIDES
   ============================================================ */

function selectSides(value) {

    selectedSides =
        value;


    document
        .getElementById(
            "singleButton"
        )
        .classList.toggle(
            "selected",
            value ===
                "Single Side"
        );


    document
        .getElementById(
            "doubleButton"
        )
        .classList.toggle(
            "selected",
            value ===
                "Double Side"
        );


    calculateAmount();

}


/* ============================================================
   CALCULATE PRICE
   ============================================================ */

function calculateAmount() {

    if (
        detectedPages < 1
    ) {

        return;

    }


    let rate = 2;


    /*
     * AXM PRICING
     *
     * B&W Single  = ₹2
     * B&W Double  = ₹3
     * Colour Single = ₹5
     * Colour Double = ₹10
     */


    if (
        selectedColour ===
            "Black & White" &&
        selectedSides ===
            "Single Side"
    ) {

        rate = 2;

    }


    else if (
        selectedColour ===
            "Black & White" &&
        selectedSides ===
            "Double Side"
    ) {

        rate = 3;

    }


    else if (
        selectedColour ===
            "Colour" &&
        selectedSides ===
            "Single Side"
    ) {

        rate = 5;

    }


    else if (
        selectedColour ===
            "Colour" &&
        selectedSides ===
            "Double Side"
    ) {

        rate = 10;

    }


    currentAmount =
        detectedPages *
        rate;


    /* -----------------------------------------------
       SHOW AMOUNT
       ----------------------------------------------- */

    document.getElementById(
        "amount"
    ).textContent =
        "₹" +
        currentAmount;


    /* -----------------------------------------------
       SHOW SUMMARY
       ----------------------------------------------- */

    document.getElementById(
        "summary"
    ).textContent =

        selectedColour +
        " • " +
        selectedSides +
        " • " +
        detectedPages +
        (
            detectedPages === 1
                ? " page"
                : " pages"
        ) +
        " • ₹" +
        rate +
        " per page";

}


/* ============================================================
   CONTINUE TO PAYMENT
   ============================================================ */

async function continueToPayment() {

    const button =
        document.getElementById(
            "continueButton"
        );


    const message =
        document.getElementById(
            "message"
        );


    if (
        detectedPages < 1
    ) {

        message.className =
            "error";


        message.textContent =
            "Page count has not been detected.";


        return;

    }


    button.disabled =
        true;


    message.className =
        "loading";


    message.textContent =
        "Preparing payment...";


    try {

        const response =
            await fetch(
                "/api/options",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            colour:
                                selectedColour,

                            sides:
                                selectedSides,

                            pages:
                                detectedPages,

                            copies:
                                1,

                            amount:
                                currentAmount

                        })

                }
            );


        const text =
            await response.text();


        let result;


        try {

            result =
                JSON.parse(text);

        }

        catch {

            throw new Error(
                "Server returned an invalid response."
            );

        }


        if (
            !response.ok ||
            !result.success
        ) {

            throw new Error(
                result.error ||
                "Unable to save print options."
            );

        }


        /* -----------------------------------------------
           SAVE JOB
           ----------------------------------------------- */

        if (
            result.job
        ) {

            sessionStorage.setItem(
                "axmJob",
                JSON.stringify(
                    result.job
                )
            );

        }


        /* -----------------------------------------------
           SUCCESS
           ----------------------------------------------- */

        message.className =
            "success";


        message.textContent =
            "✓ Options saved. Opening payment...";


        setTimeout(
            function () {

                window.location.href =
                    "/payment.html";

            },
            400
        );


    }

    catch (error) {

        console.error(
            "PAYMENT ERROR:",
            error
        );


        message.className =
            "error";


        message.textContent =
            error.message ||
            "Unable to continue.";


        button.disabled =
            false;

    }

}


/* ============================================================
   START
   ============================================================ */

loadJob();

</script>

</body>

</html>
