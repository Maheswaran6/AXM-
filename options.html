<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NIET AXM — Print Options</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #eef6fc;
            color: #123b70;
        }

        main {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .panel {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 25px;
            padding: 35px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.10);
        }

        .college-logo {
            display: block;
            width: 85px;
            height: 85px;
            object-fit: contain;
            margin: 0 auto 10px;
        }

        h1 {
            text-align: center;
            margin: 5px 0;
            font-size: 34px;
            color: #123f7a;
        }

        .subtitle {
            text-align: center;
            color: #66809d;
            margin-bottom: 30px;
        }

        .document-box {
            background: #edf7ff;
            border: 2px solid #cfe7fa;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 25px;
        }

        .document-name {
            font-size: 18px;
            font-weight: bold;
            word-break: break-word;
        }

        .page-count {
            margin-top: 10px;
            font-size: 24px;
            font-weight: bold;
            color: #1769e0;
        }

        .section {
            margin-top: 25px;
        }

        .section-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 14px;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-button {
            min-height: 80px;
            border: 2px solid #ccdbea;
            border-radius: 15px;
            background: white;
            color: #123b70;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .option-button:hover {
            border-color: #1769e0;
        }

        .option-button.selected {
            background: #1769e0;
            border-color: #1769e0;
            color: white;
            box-shadow: 0 6px 18px rgba(23,105,224,0.25);
        }

        .amount-box {
            margin-top: 30px;
            padding: 25px;
            border-radius: 18px;
            background: #f5f9fd;
            text-align: center;
        }

        .amount-label {
            font-size: 18px;
            font-weight: bold;
        }

        .amount {
            margin-top: 8px;
            font-size: 44px;
            font-weight: bold;
            color: #123f7a;
        }

        .summary {
            margin-top: 8px;
            color: #607d9b;
            font-size: 16px;
        }

        .continue-button {
            width: 100%;
            margin-top: 25px;
            padding: 18px;
            border: none;
            border-radius: 13px;
            background: #f4c51b;
            color: #123b70;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
        }

        .continue-button:hover {
            background: #e9b900;
        }

        .continue-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            min-height: 25px;
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        .success {
            color: #079447;
        }

        .error {
            color: #d92727;
        }

        .loading {
            color: #1769e0;
        }

        @media (max-width: 650px) {

            main {
                padding: 12px;
            }

            .panel {
                padding: 25px 18px;
            }

            h1 {
                font-size: 28px;
            }

            .options {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

<main>

<section class="panel">

    <img
        src="/niet-logo.png"
        class="college-logo"
        alt="NIET Logo"
    >


    <h1>
        Print Options
    </h1>

    <p class="subtitle">
        NIET AXM — Automated Xerox Machine
    </p>


    <!-- DOCUMENT -->

    <div class="document-box">

        <div
            id="documentName"
            class="document-name"
        >
            Detecting document...
        </div>

        <div
            id="pageCount"
            class="page-count"
        >
            Detecting pages...
        </div>

    </div>


    <!-- COLOUR -->

    <div class="section">

        <div class="section-title">
            1. Select Print Colour
        </div>

        <div class="options">

            <button
                id="bwButton"
                class="option-button selected"
                onclick="selectColour('Black & White')"
            >
                ⚫<br>
                Black & White
            </button>

            <button
                id="colourButton"
                class="option-button"
                onclick="selectColour('Colour')"
            >
                🌈<br>
                Colour
            </button>

        </div>

    </div>


    <!-- SIDES -->

    <div class="section">

        <div class="section-title">
            2. Select Printing Side
        </div>

        <div class="options">

            <button
                id="singleButton"
                class="option-button selected"
                onclick="selectSides('Single Side')"
            >
                📄<br>
                Single Side
            </button>

            <button
                id="doubleButton"
                class="option-button"
                onclick="selectSides('Double Side')"
            >
                📑<br>
                Double Side
            </button>

        </div>

    </div>


    <!-- AMOUNT -->

    <div class="amount-box">

        <div class="amount-label">
            Total Printing Amount
        </div>

        <div
            id="amount"
            class="amount"
        >
            ₹0
        </div>

        <div
            id="summary"
            class="summary"
        >
            Calculating...
        </div>

    </div>


    <!-- CONTINUE -->

    <button
        id="continueButton"
        class="continue-button"
        onclick="continueToPayment()"
        disabled
    >
        CONTINUE TO PAYMENT
    </button>


    <div id="message"></div>

</section>

</main>


<script>

let selectedColour = "Black & White";

let selectedSides = "Single Side";

let detectedPages = 0;

let currentAmount = 0;


/* ============================================================
   LOAD CURRENT JOB
   ============================================================ */

async function loadJob() {

    const message =
        document.getElementById("message");

    try {

        const response =
            await fetch(
                "/api/current-job",
                {
                    cache: "no-store"
                }
            );

        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success ||
            !data.job
        ) {

            throw new Error(
                "No document found."
            );

        }


        const job = data.job;


        document.getElementById(
            "documentName"
        ).textContent =
            job.filename || "Document";


        /*
         * The server will automatically
         * detect the PDF page count.
         */

        detectedPages =
            Number(job.pages);


        if (
            !Number.isFinite(detectedPages) ||
            detectedPages < 1
        ) {

            throw new Error(
                "Unable to detect PDF pages."
            );

        }


        detectedPages =
            Math.floor(detectedPages);


        document.getElementById(
            "pageCount"
        ).textContent =
            detectedPages +
            (
                detectedPages === 1
                    ? " PAGE DETECTED"
                    : " PAGES DETECTED"
            );


        document.getElementById(
            "continueButton"
        ).disabled = false;


        calculateAmount();


    } catch (error) {

        console.error(
            "JOB ERROR:",
            error
        );


        message.className =
            "error";

        message.textContent =
            error.message ||
            "Unable to load document.";

    }

}


/* ============================================================
   COLOUR
   ============================================================ */

function selectColour(value) {

    selectedColour = value;


    document
        .getElementById("bwButton")
        .classList.toggle(
            "selected",
            value === "Black & White"
        );


    document
        .getElementById("colourButton")
        .classList.toggle(
            "selected",
            value === "Colour"
        );


    calculateAmount();

}


/* ============================================================
   SIDES
   ============================================================ */

function selectSides(value) {

    selectedSides = value;


    document
        .getElementById("singleButton")
        .classList.toggle(
            "selected",
            value === "Single Side"
        );


    document
        .getElementById("doubleButton")
        .classList.toggle(
            "selected",
            value === "Double Side"
        );


    calculateAmount();

}


/* ============================================================
   CALCULATE PRICE
   ============================================================ */

function calculateAmount() {

    if (detectedPages < 1) {
        return;
    }


    let rate = 2;


    if (
        selectedColour === "Black & White" &&
        selectedSides === "Single Side"
    ) {

        rate = 2;

    }

    else if (
        selectedColour === "Black & White" &&
        selectedSides === "Double Side"
    ) {

        rate = 3;

    }

    else if (
        selectedColour === "Colour" &&
        selectedSides === "Single Side"
    ) {

        rate = 5;

    }

    else if (
        selectedColour === "Colour" &&
        selectedSides === "Double Side"
    ) {

        rate = 10;

    }


    currentAmount =
        detectedPages * rate;


    document.getElementById(
        "amount"
    ).textContent =
        "₹" + currentAmount;


    document.getElementById(
        "summary"
    ).textContent =
        selectedColour +
        " • " +
        selectedSides +
        " • " +
        detectedPages +
        (
            detectedPages === 1
                ? " page"
                : " pages"
        ) +
        " • ₹" +
        rate +
        " per page";

}


/* ============================================================
   CONTINUE TO PAYMENT
   ============================================================ */

async function continueToPayment() {

    const button =
        document.getElementById(
            "continueButton"
        );

    const message =
        document.getElementById(
            "message"
        );


    if (detectedPages < 1) {

        message.className =
            "error";

        message.textContent =
            "Page count has not been detected.";

        return;

    }


    button.disabled = true;

    message.className =
        "loading";

    message.textContent =
        "Preparing payment...";


    try {

        const response =
            await fetch(
                "/api/options",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        colour:
                            selectedColour,

                        sides:
                            selectedSides

                    })
                }
            );


        const text =
            await response.text();


        let result;


        try {

            result =
                JSON.parse(text);

        }

        catch {

            throw new Error(
                "Server returned an invalid response."
            );

        }


        if (
            !response.ok ||
            !result.success
        ) {

            throw new Error(
                result.error ||
                "Unable to save print options."
            );

        }


        if (result.job) {

            sessionStorage.setItem(
                "axmJob",
                JSON.stringify(
                    result.job
                )
            );

        }


        message.className =
            "success";

        message.textContent =
            "✓ Options saved. Opening payment...";


        setTimeout(
            function () {

                window.location.href =
                    "/payment.html";

            },
            400
        );


    }

    catch (error) {

        console.error(
            "PAYMENT ERROR:",
            error
        );


        message.className =
            "error";

        message.textContent =
            error.message ||
            "Unable to continue.";


        button.disabled = false;

    }

}


/* ============================================================
   START
   ============================================================ */

loadJob();

</script>

</body>

</html>
