<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>AXM Print Options</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

    <style>

        .option-group {
            margin: 20px 0;
        }

        .option-group h3 {
            margin-bottom: 10px;
        }

        .options {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .option {
            padding: 14px 22px;
            border: 2px solid #d5dfed;
            border-radius: 12px;
            background: white;
            color: #0b3d78;
            font-weight: 700;
            cursor: pointer;
        }

        .option.selected {
            background: #0b57d0;
            color: white;
            border-color: #0b57d0;
        }

        .option.disabled {
            opacity: 0.35;
            cursor: not-allowed;
            background: #eeeeee;
            color: #777;
        }

        .copies-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .copies-box button {
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 10px;
            background: #0b57d0;
            color: white;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
        }

        #copies {
            width: 70px;
            height: 45px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border: 2px solid #d5dfed;
            border-radius: 10px;
        }

        .summary {
            background: #f3f7fc;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
        }

        .amount {
            font-size: 28px;
            font-weight: 800;
            color: #0b57d0;
        }

        .continue-btn {
            width: 100%;
            padding: 17px;
            border: none;
            border-radius: 12px;
            background: #f5c400;
            color: #062b55;
            font-weight: 800;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
        }

        .info {
            color: #666;
            font-size: 14px;
        }

    </style>

</head>


<body>

<main>

<section class="panel">

    <h1>Print Options</h1>

    <div id="loading">
        Loading document...
    </div>


    <div
        id="content"
        style="display:none;"
    >

        <!-- ========================================= -->
        <!-- DOCUMENT INFORMATION -->
        <!-- ========================================= -->

        <div class="summary">

            <div class="summary-row">

                <b>Document</b>

                <span id="filename">
                </span>

            </div>


            <div class="summary-row">

                <b>Pages Detected</b>

                <strong id="pages">
                </strong>

            </div>


            <div class="summary-row">

                <b>Copies</b>

                <strong id="copiesSummary">
                    1
                </strong>

            </div>

        </div>


        <!-- ========================================= -->
        <!-- COLOUR -->
        <!-- ========================================= -->

        <div class="option-group">

            <h3>Colour</h3>

            <div class="options">

                <button
                    class="option selected"
                    id="bwBtn"
                    onclick="selectColour('Black & White')"
                >
                    Black & White
                </button>


                <button
                    class="option"
                    id="colourBtn"
                    onclick="selectColour('Colour')"
                >
                    Colour
                </button>

            </div>

        </div>


        <!-- ========================================= -->
        <!-- SIDES -->
        <!-- ========================================= -->

        <div class="option-group">

            <h3>Sides</h3>

            <div class="options">

                <button
                    class="option selected"
                    id="singleBtn"
                    onclick="selectSides('Single Side')"
                >
                    Single Side
                </button>


                <button
                    class="option"
                    id="doubleBtn"
                    onclick="selectSides('Double Side')"
                >
                    Double Side
                </button>

            </div>


            <p
                id="doubleMessage"
                class="info"
            >
            </p>

        </div>


        <!-- ========================================= -->
        <!-- COPIES -->
        <!-- ========================================= -->

        <div class="option-group">

            <h3>How many copies?</h3>

            <div class="copies-box">

                <button
                    onclick="changeCopies(-1)"
                >
                    −
                </button>


                <input
                    type="number"
                    id="copies"
                    value="1"
                    min="1"
                    max="50"
                    readonly
                >


                <button
                    onclick="changeCopies(1)"
                >
                    +
                </button>

            </div>

        </div>


        <!-- ========================================= -->
        <!-- TOTAL -->
        <!-- ========================================= -->

        <div class="summary">

            <div class="summary-row">

                <b>Pages</b>

                <span id="totalPages">
                    1
                </span>

            </div>


            <div class="summary-row">

                <b>Copies</b>

                <span id="totalCopies">
                    1
                </span>

            </div>


            <div class="summary-row">

                <b>Rate</b>

                <span id="rate">
                    ₹3
                </span>

            </div>


            <div class="summary-row">

                <b>Total Amount</b>

                <span
                    class="amount"
                    id="amount"
                >
                    ₹3
                </span>

            </div>

        </div>


        <button
            class="continue-btn"
            onclick="continueToPayment()"
        >
            CONTINUE TO PAYMENT
        </button>

    </div>

</section>

</main>


<script>

let job = null;

let selectedColour =
    "Black & White";

let selectedSides =
    "Single Side";

let copies = 1;



// =====================================================
// LOAD JOB
// =====================================================

async function loadJob() {

    try {

        const response =
            await fetch("/api/job");

        const data =
            await response.json();


        if (!response.ok || !data.job) {

            throw new Error(
                "No document received."
            );

        }


        job =
            data.job;


        // =============================================
        // DISPLAY INFORMATION
        // =============================================

        document.getElementById(
            "filename"
        ).textContent =
            job.filename;


        document.getElementById(
            "pages"
        ).textContent =
            job.pages;


        document.getElementById(
            "totalPages"
        ).textContent =
            job.pages;


        // =============================================
        // IMPORTANT
        // DOUBLE SIDE RULE
        // =============================================

        updateDoubleSide();


        // =============================================
        // UPDATE PRICE
        // =============================================

        updatePrice();


        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "content"
        ).style.display =
            "block";

    }

    catch (error) {

        document.getElementById(
            "loading"
        ).textContent =
            error.message;

    }

}



// =====================================================
// DOUBLE SIDE ENABLE / DISABLE
// =====================================================

function updateDoubleSide() {

    const doubleBtn =
        document.getElementById(
            "doubleBtn"
        );

    const message =
        document.getElementById(
            "doubleMessage"
        );


    // =============================================
    // ONLY ONE PAGE
    // =============================================

    if (
        Number(job.pages) <= 1
    ) {

        doubleBtn.classList.add(
            "disabled"
        );

        doubleBtn.disabled =
            true;

        selectedSides =
            "Single Side";


        document.getElementById(
            "singleBtn"
        ).classList.add(
            "selected"
        );


        document.getElementById(
            "doubleBtn"
        ).classList.remove(
            "selected"
        );


        message.textContent =
            "Double Side is unavailable because only 1 page was detected.";

    }


    // =============================================
    // TWO OR MORE PAGES
    // =============================================

    else {

        doubleBtn.classList.remove(
            "disabled"
        );

        doubleBtn.disabled =
            false;

        message.textContent =
            "";

    }

}



// =====================================================
// COLOUR
// =====================================================

function selectColour(value) {

    selectedColour =
        value;


    document.getElementById(
        "bwBtn"
    ).classList.toggle(
        "selected",
        value === "Black & White"
    );


    document.getElementById(
        "colourBtn"
    ).classList.toggle(
        "selected",
        value === "Colour"
    );


    updatePrice();

}



// =====================================================
// SIDES
// =====================================================

function selectSides(value) {

    // =============================================
    // DO NOT ALLOW DOUBLE SIDE FOR ONE PAGE
    // =============================================

    if (
        value === "Double Side" &&
        Number(job.pages) <= 1
    ) {

        return;

    }


    selectedSides =
        value;


    document.getElementById(
        "singleBtn"
    ).classList.toggle(
        "selected",
        value === "Single Side"
    );


    document.getElementById(
        "doubleBtn"
    ).classList.toggle(
        "selected",
        value === "Double Side"
    );


    updatePrice();

}



// =====================================================
// COPIES
// =====================================================

function changeCopies(change) {

    copies +=
        change;


    if (copies < 1) {

        copies = 1;

    }


    if (copies > 50) {

        copies = 50;

    }


    document.getElementById(
        "copies"
    ).value =
        copies;


    document.getElementById(
        "copiesSummary"
    ).textContent =
        copies;


    document.getElementById(
        "totalCopies"
    ).textContent =
        copies;


    updatePrice();

}



// =====================================================
// PRICE
// =====================================================

function getRate() {

    if (
        selectedColour ===
        "Black & White"
    ) {

        if (
            selectedSides ===
            "Single Side"
        ) {

            return 3;

        }

        return 1.80;

    }


    if (
        selectedSides ===
        "Single Side"
    ) {

        return 5;

    }

    return 10;

}



function updatePrice() {

    if (!job) {

        return;

    }


    const rate =
        getRate();


    const total =
        Number(job.pages) *
        copies *
        rate;


    document.getElementById(
        "rate"
    ).textContent =
        "₹" + rate;


    document.getElementById(
        "amount"
    ).textContent =
        "₹" +
        total.toFixed(2);

}



// =====================================================
// SAVE OPTIONS
// =====================================================

async function continueToPayment() {

    try {

        const response =
            await fetch(
                "/api/options",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            colour:
                                selectedColour,

                            sides:
                                selectedSides,

                            pages:
                                Number(
                                    job.pages
                                ),

                            copies:
                                copies

                        })

                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                "Unable to save options."
            );

        }


        window.location.href =
            "/payment.html";

    }

    catch (error) {

        alert(
            error.message
        );

    }

}



// =====================================================
// START
// =====================================================

loadJob();

</script>

</body>

</html>
