<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>NIET AXM — Print Options</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #eef6fc;
            color: #123b70;
        }

        main {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 12px 10px 20px;
        }

        .panel {
            width: 100%;
            max-width: 780px;
            background: white;
            border-radius: 20px;
            padding: 20px 25px 25px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.10);
        }

        .college-logo {
            display: block;
            width: 58px;
            height: 58px;
            object-fit: contain;
            margin: 0 auto 4px;
        }

        h1 {
            text-align: center;
            margin: 2px 0;
            font-size: 30px;
            color: #123f7a;
        }

        .subtitle {
            text-align: center;
            color: #66809d;
            margin: 3px 0 13px;
            font-size: 14px;
        }

        .document-box {
            background: #edf7ff;
            border: 2px solid #cfe7fa;
            border-radius: 14px;
            padding: 10px 15px;
            text-align: center;
            margin-bottom: 13px;
        }

        .document-name {
            font-size: 16px;
            font-weight: bold;
            word-break: break-word;
        }

        .page-count {
            margin-top: 4px;
            font-size: 20px;
            font-weight: bold;
            color: #1769e0;
        }

        .section {
            margin-top: 12px;
        }

        .section-title {
            text-align: center;
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px;
        }

        .option-button {
            min-height: 58px;
            border: 2px solid #ccdbea;
            border-radius: 12px;
            background: white;
            color: #123b70;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .option-button:hover {
            border-color: #1769e0;
        }

        .option-button.selected {
            background: #1769e0;
            border-color: #1769e0;
            color: white;
            box-shadow: 0 5px 15px rgba(23,105,224,0.22);
        }

        /* =====================================================
           COPIES
           ===================================================== */

        .copies-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 5px;
        }

        .copy-control {
            width: 48px;
            height: 48px;
            border: 2px solid #ccdbea;
            border-radius: 50%;
            background: white;
            color: #1769e0;
            font-size: 25px;
            font-weight: bold;
            cursor: pointer;
        }

        .copy-control:hover {
            background: #edf7ff;
            border-color: #1769e0;
        }

        .copy-number {
            min-width: 70px;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            color: #123f7a;
        }

        .copies-help {
            text-align: center;
            margin-top: 5px;
            color: #66809d;
            font-size: 13px;
        }

        .amount-box {
            margin-top: 16px;
            padding: 15px;
            border-radius: 15px;
            background: #f5f9fd;
            text-align: center;
        }

        .amount-label {
            font-size: 16px;
            font-weight: bold;
        }

        .amount {
            margin-top: 2px;
            font-size: 38px;
            font-weight: bold;
            color: #123f7a;
        }

        .summary {
            margin-top: 4px;
            color: #607d9b;
            font-size: 14px;
        }

        .continue-button {
            width: 100%;
            margin-top: 15px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #f4c51b;
            color: #123b70;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .continue-button:hover {
            background: #e9b900;
        }

        .continue-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            min-height: 20px;
            margin-top: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }

        .success {
            color: #079447;
        }

        .error {
            color: #d92727;
        }

        .loading {
            color: #1769e0;
        }

        @media (max-width: 600px) {

            main {
                padding: 7px 6px 15px;
            }

            .panel {
                padding: 16px 12px 20px;
                border-radius: 17px;
            }

            .college-logo {
                width: 52px;
                height: 52px;
            }

            h1 {
                font-size: 25px;
            }

            .subtitle {
                font-size: 12px;
                margin-bottom: 10px;
            }

            .document-box {
                padding: 9px 10px;
                margin-bottom: 10px;
            }

            .document-name {
                font-size: 14px;
            }

            .page-count {
                font-size: 18px;
            }

            .section {
                margin-top: 10px;
            }

            .section-title {
                font-size: 15px;
                margin-bottom: 6px;
            }

            .option-button {
                min-height: 55px;
                font-size: 14px;
            }

            .copy-control {
                width: 44px;
                height: 44px;
            }

            .copy-number {
                font-size: 24px;
            }

            .amount-box {
                margin-top: 14px;
                padding: 13px;
            }

            .amount {
                font-size: 34px;
            }

            .continue-button {
                padding: 14px;
                font-size: 16px;
            }
        }

    </style>

</head>


<body>

<main>

<section class="panel">

    <img
        src="/niet-logo.png"
        class="college-logo"
        alt="NIET Logo"
    >

    <h1>
        Print Options
    </h1>

    <p class="subtitle">
        NIET AXM — Automated Xerox Machine
    </p>


    <!-- DOCUMENT -->

    <div class="document-box">

        <div
            id="documentName"
            class="document-name"
        >
            Detecting document...
        </div>

        <div
            id="pageCount"
            class="page-count"
        >
            Detecting pages...
        </div>

    </div>


    <!-- COLOUR -->

    <div class="section">

        <div class="section-title">
            1. Select Print Colour
        </div>

        <div class="options">

            <button
                id="bwButton"
                class="option-button selected"
                type="button"
                onclick="selectColour('Black & White')"
            >
                Black &amp; White
            </button>

            <button
                id="colourButton"
                class="option-button"
                type="button"
                onclick="selectColour('Colour')"
            >
                Colour
            </button>

        </div>

    </div>


    <!-- SIDES -->

    <div class="section">

        <div class="section-title">
            2. Select Printing Side
        </div>

        <div class="options">

            <button
                id="singleButton"
                class="option-button selected"
                type="button"
                onclick="selectSides('Single Side')"
            >
                Single Side
            </button>

            <button
                id="doubleButton"
                class="option-button"
                type="button"
                onclick="selectSides('Double Side')"
            >
                Double Side
            </button>

        </div>

    </div>


    <!-- COPIES -->

    <div class="section">

        <div class="section-title">
            3. How Many Copies?
        </div>

        <div class="copies-box">

            <button
                class="copy-control"
                type="button"
                onclick="changeCopies(-1)"
            >
                −
            </button>

            <div
                id="copyNumber"
                class="copy-number"
            >
                1
            </div>

            <button
                class="copy-control"
                type="button"
                onclick="changeCopies(1)"
            >
                +
            </button>

        </div>

        <div class="copies-help">
            Select the number of copies you want to print.
        </div>

    </div>


    <!-- AMOUNT -->

    <div class="amount-box">

        <div class="amount-label">
            Total Printing Amount
        </div>

        <div
            id="amount"
            class="amount"
        >
            ₹0
        </div>

        <div
            id="summary"
            class="summary"
        >
            Calculating...
        </div>

    </div>


    <!-- CONTINUE -->

    <button
        id="continueButton"
        class="continue-button"
        type="button"
        onclick="continueToPayment()"
        disabled
    >
        CONTINUE TO PAYMENT
    </button>


    <div id="message"></div>

</section>

</main>


<script>

/* ============================================================
   SELECTION
   ============================================================ */

let selectedColour = "Black & White";

let selectedSides = "Single Side";

let detectedPages = 0;

let selectedCopies = 1;

let currentAmount = 0;


/* ============================================================
   LOAD JOB
   ============================================================ */

async function loadJob() {

    const message =
        document.getElementById("message");

    try {

        const response =
            await fetch(
                "/api/current-job",
                {
                    cache: "no-store"
                }
            );

        const data =
            await response.json();

        if (
            !response.ok ||
            !data.success ||
            !data.job
        ) {

            throw new Error(
                "No document found."
            );

        }

        const job =
            data.job;


        /* DOCUMENT NAME */

        document.getElementById(
            "documentName"
        ).textContent =
            job.filename ||
            "Document";


        /* PAGE COUNT */

        detectedPages =
            Number(job.pages);


        if (
            !Number.isFinite(detectedPages) ||
            detectedPages < 1
        ) {

            throw new Error(
                "Unable to detect PDF pages."
            );

        }


        detectedPages =
            Math.floor(detectedPages);


        document.getElementById(
            "pageCount"
        ).textContent =
            detectedPages +
            (
                detectedPages === 1
                    ? " PAGE DETECTED"
                    : " PAGES DETECTED"
            );


        /* ENABLE BUTTON */

        document.getElementById(
            "continueButton"
        ).disabled = false;


        calculateAmount();

    }

    catch (error) {

        console.error(
            "JOB ERROR:",
            error
        );

        message.className =
            "error";

        message.textContent =
            error.message ||
            "Unable to load document.";

    }

}


/* ============================================================
   COLOUR
   ============================================================ */

function selectColour(value) {

    selectedColour =
        value;

    document
        .getElementById("bwButton")
        .classList.toggle(
            "selected",
            value === "Black & White"
        );

    document
        .getElementById("colourButton")
        .classList.toggle(
            "selected",
            value === "Colour"
        );

    calculateAmount();

}


/* ============================================================
   SIDES
   ============================================================ */

function selectSides(value) {

    selectedSides =
        value;

    document
        .getElementById("singleButton")
        .classList.toggle(
            "selected",
            value === "Single Side"
        );

    document
        .getElementById("doubleButton")
        .classList.toggle(
            "selected",
            value === "Double Side"
        );

    calculateAmount();

}


/* ============================================================
   COPIES
   ============================================================ */

function changeCopies(change) {

    selectedCopies =
        selectedCopies +
        change;


    /* Minimum 1 copy */

    if (selectedCopies < 1) {

        selectedCopies = 1;

    }


    /* Maximum 50 copies */

    if (selectedCopies > 50) {

        selectedCopies = 50;

    }


    document.getElementById(
        "copyNumber"
    ).textContent =
        selectedCopies;


    calculateAmount();

}


/* ============================================================
   PRICE
   ============================================================ */

function getRate() {

    if (
        selectedColour === "Black & White" &&
        selectedSides === "Single Side"
    ) {

        return 3;

    }


    if (
        selectedColour === "Black & White" &&
        selectedSides === "Double Side"
    ) {

        return 1.80;

    }


    if (
        selectedColour === "Colour" &&
        selectedSides === "Single Side"
    ) {

        return 5;

    }


    if (
        selectedColour === "Colour" &&
        selectedSides === "Double Side"
    ) {

        return 10;

    }


    return 3;

}


/* ============================================================
   CALCULATE AMOUNT
   ============================================================ */

function calculateAmount() {

    if (detectedPages < 1) {

        return;

    }


    const rate =
        getRate();


    currentAmount =
        detectedPages *
        selectedCopies *
        rate;


    currentAmount =
        Math.round(
            currentAmount * 100
        ) / 100;


    document.getElementById(
        "amount"
    ).textContent =
        "₹" +
        currentAmount.toFixed(
            2
        );


    document.getElementById(
        "summary"
    ).textContent =

        selectedColour +
        " • " +
        selectedSides +
        " • " +
        detectedPages +
        (
            detectedPages === 1
                ? " page"
                : " pages"
        ) +
        " • " +
        selectedCopies +
        (
            selectedCopies === 1
                ? " copy"
                : " copies"
        ) +
        " • ₹" +
        rate.toFixed(2) +
        " per page";


}


/* ============================================================
   CONTINUE TO PAYMENT
   ============================================================ */

async function continueToPayment() {

    const button =
        document.getElementById(
            "continueButton"
        );

    const message =
        document.getElementById(
            "message"
        );


    if (detectedPages < 1) {

        message.className =
            "error";

        message.textContent =
            "Page count has not been detected.";

        return;

    }


    if (selectedCopies < 1) {

        message.className =
            "error";

        message.textContent =
            "Please select at least 1 copy.";

        return;

    }


    button.disabled =
        true;

    message.className =
        "loading";

    message.textContent =
        "Saving print options...";


    try {

        const response =
            await fetch(
                "/api/options",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            colour:
                                selectedColour,

                            sides:
                                selectedSides,

                            pages:
                                detectedPages,

                            copies:
                                selectedCopies

                        })

                }
            );


        const result =
            await response.json();


        if (
            !response.ok ||
            !result.success
        ) {

            throw new Error(
                result.error ||
                "Unable to save print options."
            );

        }


        /* SAVE JOB */

        if (result.job) {

            sessionStorage.setItem(
                "axmJob",
                JSON.stringify(
                    result.job
                )
            );

        }


        message.className =
            "success";

        message.textContent =
            "Options saved. Opening payment...";


        setTimeout(
            function() {

                window.location.href =
                    "/payment.html";

            },
            400
        );

    }

    catch (error) {

        console.error(
            "OPTIONS ERROR:",
            error
        );

        message.className =
            "error";

        message.textContent =
            error.message ||
            "Unable to continue.";

        button.disabled =
            false;

    }

}


/* ============================================================
   START
   ============================================================ */

loadJob();

</script>

</body>

</html>
