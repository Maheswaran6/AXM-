<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AXM - Print Options</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f7f9fc;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #102a43;
    }

    .container {
      width: 100%;
      max-width: 600px;
      padding: 30px 20px;
      text-align: center;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 35px 25px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 34px;
      margin-bottom: 30px;
    }

    h2 {
      font-size: 23px;
      margin: 20px 0 15px;
    }

    .button-group {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .option-btn {
      min-width: 145px;
      padding: 15px 20px;
      border: 2px solid #d5dfeb;
      border-radius: 12px;
      background: white;
      color: #102a43;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-btn:hover {
      border-color: #2563eb;
      transform: translateY(-2px);
    }

    /* SELECTED BUTTON */
    .option-btn.selected {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
      box-shadow: 0 5px 15px rgba(37, 99, 235, 0.3);
      transform: translateY(-2px);
    }

    .option-btn.selected::before {
      content: "✓ ";
      font-size: 18px;
    }

    .input-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin: 15px 0;
    }

    .input-row label {
      width: 80px;
      text-align: right;
      font-size: 17px;
      font-weight: bold;
    }

    .input-row input {
      width: 120px;
      padding: 12px;
      border: 2px solid #d5dfeb;
      border-radius: 10px;
      font-size: 17px;
      text-align: center;
    }

    .amount {
      margin-top: 25px;
      font-size: 25px;
      font-weight: bold;
    }

    #selected-info {
      margin-top: 12px;
      font-size: 14px;
      color: #52667a;
    }

    .payment-btn {
      margin-top: 30px;
      width: 100%;
      max-width: 300px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #f5c518;
      color: #102a43;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .payment-btn:hover {
      background: #eab900;
      transform: translateY(-2px);
    }

    .payment-btn:active {
      transform: scale(0.98);
    }

    .note {
      margin-top: 25px;
      color: #64748b;
      font-size: 14px;
      line-height: 1.5;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 28px;
      }

      .option-btn {
        width: 100%;
        max-width: 260px;
      }

      .input-row {
        justify-content: center;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>Print Options</h1>

      <!-- COLOUR -->
      <h2>Colour</h2>

      <div class="button-group">

        <button
          type="button"
          class="option-btn selected"
          id="bwBtn"
          onclick="selectColour('bw')">
          Black & White ₹2
        </button>

        <button
          type="button"
          class="option-btn"
          id="colourBtn"
          onclick="selectColour('colour')">
          Colour ₹5
        </button>

      </div>


      <!-- SIDES -->
      <h2>Sides</h2>

      <div class="button-group">

        <button
          type="button"
          class="option-btn selected"
          id="singleBtn"
          onclick="selectSides('single')">
          Single Side
        </button>

        <button
          type="button"
          class="option-btn"
          id="doubleBtn"
          onclick="selectSides('double')">
          Double Side
        </button>

      </div>


      <!-- PAGES -->
      <div class="input-row">
        <label for="pages">Pages</label>

        <input
          type="number"
          id="pages"
          value="1"
          min="1"
          oninput="calculateAmount()">
      </div>


      <!-- COPIES -->
      <div class="input-row">
        <label for="copies">Copies</label>

        <input
          type="number"
          id="copies"
          value="1"
          min="1"
          oninput="calculateAmount()">
      </div>


      <!-- AMOUNT -->
      <div class="amount">
        Amount: ₹<span id="amount">2</span>
      </div>

      <div id="selected-info">
        Black & White • Single Side
      </div>


      <!-- PAYMENT -->
      <button
        type="button"
        class="payment-btn"
        onclick="continueToPayment()">
        CONTINUE TO PAYMENT
      </button>


      <div class="note">
        For development only, the next page contains a test-success
        button. Real Razorpay verification must be configured before
        accepting real money.
      </div>

    </div>

  </div>


  <script>

    // DEFAULT OPTIONS
    let selectedColour = "bw";
    let selectedSides = "single";


    // -----------------------------
    // COLOUR SELECTION
    // -----------------------------
    function selectColour(colour) {

      selectedColour = colour;

      const bwBtn = document.getElementById("bwBtn");
      const colourBtn = document.getElementById("colourBtn");

      // Remove selected state
      bwBtn.classList.remove("selected");
      colourBtn.classList.remove("selected");

      // Add selected state
      if (colour === "bw") {
        bwBtn.classList.add("selected");
      } else {
        colourBtn.classList.add("selected");
      }

      calculateAmount();
    }


    // -----------------------------
    // SIDES SELECTION
    // -----------------------------
    function selectSides(sides) {

      selectedSides = sides;

      const singleBtn = document.getElementById("singleBtn");
      const doubleBtn = document.getElementById("doubleBtn");

      // Remove selected state
      singleBtn.classList.remove("selected");
      doubleBtn.classList.remove("selected");

      // Add selected state
      if (sides === "single") {
        singleBtn.classList.add("selected");
      } else {
        doubleBtn.classList.add("selected");
      }

      calculateAmount();
    }


    // -----------------------------
    // CALCULATE AMOUNT
    // -----------------------------
    function calculateAmount() {

      let pages = parseInt(
        document.getElementById("pages").value
      ) || 1;

      let copies = parseInt(
        document.getElementById("copies").value
      ) || 1;

      if (pages < 1) pages = 1;
      if (copies < 1) copies = 1;

      document.getElementById("pages").value = pages;
      document.getElementById("copies").value = copies;


      // Price per printed page
      let pricePerPage;

      if (selectedColour === "bw") {
        pricePerPage = 2;
      } else {
        pricePerPage = 5;
      }


      // Double side uses two pages per sheet.
      // The total number of pages is still charged based
      // on the pages selected.
      let total = pricePerPage * pages * copies;


      document.getElementById("amount").textContent = total;


      updateSelectedInfo();
    }


    // -----------------------------
    // DISPLAY CURRENT SELECTION
    // -----------------------------
    function updateSelectedInfo() {

      const colourText =
        selectedColour === "bw"
          ? "Black & White"
          : "Colour";

      const sidesText =
        selectedSides === "single"
          ? "Single Side"
          : "Double Side";

      document.getElementById("selected-info").textContent =
        colourText + " • " + sidesText;
    }


    // -----------------------------
    // CONTINUE TO PAYMENT
    // -----------------------------
    function continueToPayment() {

      const pages =
        parseInt(document.getElementById("pages").value) || 1;

      const copies =
        parseInt(document.getElementById("copies").value) || 1;

      const amount =
        parseInt(document.getElementById("amount").textContent) || 0;


      // Save selection in browser
      const printOptions = {

        colour: selectedColour,

        colourName:
          selectedColour === "bw"
            ? "Black & White"
            : "Colour",

        sides: selectedSides,

        sidesName:
          selectedSides === "single"
            ? "Single Side"
            : "Double Side",

        pages: pages,

        copies: copies,

        amount: amount
      };


      localStorage.setItem(
        "axmPrintOptions",
        JSON.stringify(printOptions)
      );


      // Go to payment page
      window.location.href =
        "payment.html";
    }


    // Initial calculation
    calculateAmount();

  </script>

</body>
</html>
