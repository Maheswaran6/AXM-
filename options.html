<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>AXM — Print Options</title>

<link
  rel="stylesheet"
  href="/style.css"
>

<style>

.choices {
  display: flex;
  justify-content: center;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.choice-btn {
  padding: 16px 22px;
  border-radius: 12px;
  border: 2px solid #d4deeb;
  background: white;
  font-weight: 700;
  cursor: pointer;
  transition: 0.15s;
}

.choice-btn:hover {
  transform: translateY(-1px);
}

.choice-btn.selected {
  background: #0b57d0;
  color: white;
  border-color: #0b57d0;
  box-shadow: 0 0 0 4px rgba(11,87,208,0.15);
}

#selectedInfo {
  margin: 15px 0;
  padding: 12px;
  border-radius: 10px;
  background: #edf5ff;
  color: #0b57d0;
  font-weight: 700;
}

</style>

</head>

<body>

<main>

<section class="panel">

<h1>Print Options</h1>

<div id="file">
  Loading...
</div>

<h2>Colour</h2>

<div class="choices">

<button
  id="bwBtn"
  class="choice-btn selected"
  onclick="pickColor('bw')"
>
  Black &amp; White ₹2
</button>

<button
  id="colorBtn"
  class="choice-btn"
  onclick="pickColor('color')"
>
  Colour ₹5
</button>

</div>

<h2>Sides</h2>

<div class="choices">

<button
  id="singleBtn"
  class="choice-btn selected"
  onclick="pickSides('single')"
>
  Single Side
</button>

<button
  id="doubleBtn"
  class="choice-btn"
  onclick="pickSides('double')"
>
  Double Side
</button>

</div>

<div id="selectedInfo">
  Black &amp; White • Single Side
</div>

<label>

  Pages

  <input
    id="pages"
    type="number"
    min="1"
    value="1"
  >

</label>

<br>

<label>

  Copies

  <input
    id="copies"
    type="number"
    min="1"
    value="1"
  >

</label>

<h2 id="amount">
  Amount: ₹2
</h2>

<button
  class="button"
  onclick="save()"
>
  CONTINUE TO PAYMENT
</button>

<p class="muted">
  Your selected Colour, Side, Pages and Copies
  will be saved before opening payment.
</p>

</section>

</main>

<script>

let color = "bw";
let sides = "single";

// ======================================================
// COLOUR
// ======================================================

function pickColor(value) {

  color =
    value;

  document
    .querySelector("#bwBtn")
    .classList.toggle(
      "selected",
      color === "bw"
    );

  document
    .querySelector("#colorBtn")
    .classList.toggle(
      "selected",
      color === "color"
    );

  update();
}

// ======================================================
// SIDES
// ======================================================

function pickSides(value) {

  sides =
    value;

  document
    .querySelector("#singleBtn")
    .classList.toggle(
      "selected",
      sides === "single"
    );

  document
    .querySelector("#doubleBtn")
    .classList.toggle(
      "selected",
      sides === "double"
    );

  update();
}

// ======================================================
// UPDATE UI
// ======================================================

function update() {

  let pages =
    Number(
      document.querySelector(
        "#pages"
      ).value
    );

  let copies =
    Number(
      document.querySelector(
        "#copies"
      ).value
    );

  if (!Number.isFinite(pages) || pages < 1) {
    pages = 1;
  }

  if (!Number.isFinite(copies) || copies < 1) {
    copies = 1;
  }

  pages =
    Math.floor(pages);

  copies =
    Math.floor(copies);

  const rate =
    color === "color"
      ? 5
      : 2;

  const sheets =
    sides === "double"
      ? Math.ceil(pages / 2)
      : pages;

  const total =
    rate *
    sheets *
    copies;

  document.querySelector(
    "#amount"
  ).textContent =
    "Amount: ₹" + total;

  document.querySelector(
    "#selectedInfo"
  ).textContent =
    (
      color === "color"
        ? "Colour"
        : "Black & White"
    )
    +
    " • "
    +
    (
      sides === "double"
        ? "Double Side"
        : "Single Side"
    );
}

// ======================================================
// SAVE OPTIONS
// ======================================================

async function save() {

  const pages =
    Math.max(
      1,
      Math.floor(
        Number(
          document.querySelector(
            "#pages"
          ).value
        ) || 1
      )
    );

  const copies =
    Math.max(
      1,
      Math.floor(
        Number(
          document.querySelector(
            "#copies"
          ).value
        ) || 1
      )
    );

  try {

    const response =
      await fetch(
        "/api/job/options",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              color,
              sides,
              pages,
              copies
            })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      alert(
        data.error ||
        "Unable to save options."
      );

      return;
    }

    window.location.href =
      "/payment.html";

  } catch (error) {

    alert(
      "Server connection failed."
    );
  }
}

// ======================================================
// INPUT EVENTS
// ======================================================

document
  .querySelector("#pages")
  .addEventListener(
    "input",
    update
  );

document
  .querySelector("#copies")
  .addEventListener(
    "input",
    update
  );

update();

</script>

</body>

</html>
