<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>AXM — Send Document</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <style>

    .upload-card {
      max-width: 650px;
      margin: 50px auto;
      padding: 35px;
      background: #ffffff;
      border-radius: 22px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.08);
      text-align: center;
    }

    .upload-card h1 {
      color: #123d69;
    }

    .upload-card p {
      color: #123d69;
    }

    #file {
      width: 100%;
      box-sizing: border-box;
      padding: 16px;
      margin: 25px 0;
      border: 2px dashed #cbd8e8;
      border-radius: 12px;
      background: #f8fbff;
    }

    .button {
      width: 100%;
      border: none;
      cursor: pointer;
      padding: 16px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
    }

    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #progressBox {
      display: none;
      margin-top: 25px;
    }

    #progressBackground {
      width: 100%;
      height: 18px;
      background: #e5eaf0;
      border-radius: 20px;
      overflow: hidden;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      background: #f5c400;
      transition: width 0.2s;
    }

    #progressText {
      font-weight: bold;
    }

    #msg {
      margin-top: 20px;
      font-weight: bold;
      line-height: 1.5;
    }

    .success {
      color: #078a45 !important;
    }

    .error {
      color: #d93025 !important;
    }

    .working {
      color: #123d69 !important;
    }

    #debug {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 10px;
      text-align: left;
      font-family: monospace;
      font-size: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

  </style>

</head>


<body>

<main>

<section class="upload-card">

  <h1>AXM — Send Document</h1>

  <p>
    Select <b>one PDF or one image</b>
    to send to the AXM machine.
  </p>


  <form id="form">

    <input
      id="file"
      name="document"
      type="file"
      accept=".pdf,.jpg,.jpeg,.png,.webp,application/pdf,image/jpeg,image/png,image/webp"
      required
    >

    <button
      id="sendButton"
      class="button"
      type="submit"
    >
      SEND TO AXM
    </button>

  </form>


  <div id="progressBox">

    <div id="progressBackground">

      <div id="progressBar"></div>

    </div>

    <p id="progressText">
      0%
    </p>

  </div>


  <p id="msg"></p>

  <pre id="debug"></pre>

</section>

</main>


<script>

const form =
  document.getElementById("form");

const fileInput =
  document.getElementById("file");

const sendButton =
  document.getElementById("sendButton");

const msg =
  document.getElementById("msg");

const progressBox =
  document.getElementById("progressBox");

const progressBar =
  document.getElementById("progressBar");

const progressText =
  document.getElementById("progressText");

const debug =
  document.getElementById("debug");


form.addEventListener(
  "submit",
  function(event) {

    event.preventDefault();


    debug.style.display = "none";

    debug.textContent = "";


    const files =
      fileInput.files;


    if (!files || files.length !== 1) {

      msg.className = "error";

      msg.textContent =
        "Please select exactly one document.";

      return;

    }


    const file =
      files[0];


    console.log(
      "Selected file:",
      file.name
    );

    console.log(
      "File type:",
      file.type
    );

    console.log(
      "File size:",
      file.size
    );


    /*
      Maximum file size:
      25 MB
    */

    const maxSize =
      25 * 1024 * 1024;


    if (file.size > maxSize) {

      msg.className = "error";

      msg.textContent =
        "File is larger than 25 MB.";

      return;

    }


    /*
      Start UI
    */

    sendButton.disabled = true;

    sendButton.textContent =
      "UPLOADING...";


    progressBox.style.display =
      "block";


    progressBar.style.width =
      "0%";


    progressText.textContent =
      "0%";


    msg.className =
      "working";

    msg.textContent =
      "Connecting to AXM...";


    /*
      IMPORTANT
      Server expects:
      document
    */

    const formData =
      new FormData();


    formData.append(
      "document",
      file
    );


    /*
      XMLHttpRequest
    */

    const xhr =
      new XMLHttpRequest();


    xhr.open(
      "POST",
      "/api/upload",
      true
    );


    /*
      Give the upload 3 minutes.
    */

    xhr.timeout =
      180000;


    /*
      Progress
    */

    xhr.upload.onprogress =
      function(event) {

        if (!event.lengthComputable) {

          return;

        }


        const percent =
          Math.round(
            (event.loaded / event.total) * 100
          );


        progressBar.style.width =
          percent + "%";


        progressText.textContent =
          "Uploading: " +
          percent +
          "%";


        if (percent < 100) {

          msg.textContent =
            "Sending document to AXM...";

        }

      };


    /*
      RESPONSE
    */

    xhr.onload =
      function() {

        console.log(
          "HTTP status:",
          xhr.status
        );

        console.log(
          "Response:",
          xhr.responseText
        );


        sendButton.disabled =
          false;

        sendButton.textContent =
          "SEND TO AXM";


        /*
          Read response as TEXT first.

          This is important because
          the previous version assumed
          every response was JSON.
        */

        const raw =
          xhr.responseText || "";


        let data = null;


        try {

          data =
            JSON.parse(raw);

        } catch(error) {

          /*
            Server returned something
            other than JSON.
          */

          console.error(
            "Invalid JSON response:",
            raw
          );


          msg.className =
            "error";

          msg.textContent =
            "AXM server returned an unexpected response.";


          debug.style.display =
            "block";


          debug.textContent =
            "HTTP STATUS: " +
            xhr.status +
            "\n\nSERVER RESPONSE:\n" +
            raw.substring(0, 3000);


          return;

        }


        /*
          SUCCESS
        */

        if (
          xhr.status >= 200 &&
          xhr.status < 300 &&
          data.ok
        ) {

          progressBar.style.width =
            "100%";


          progressText.textContent =
            "100% — COMPLETE";


          msg.className =
            "success";


          msg.textContent =
            "✓ Document successfully sent to AXM.";


          fileInput.disabled =
            true;


          sendButton.style.display =
            "none";


          return;

        }


        /*
          SERVER ERROR
        */

        msg.className =
          "error";


        msg.textContent =
          data.error ||
          "AXM could not accept the document.";


        debug.style.display =
          "block";


        debug.textContent =
          "HTTP STATUS: " +
          xhr.status +
          "\n\nSERVER RESPONSE:\n" +
          raw;

      };


    /*
      NETWORK ERROR
    */

    xhr.onerror =
      function() {

        console.error(
          "Network error"
        );


        sendButton.disabled =
          false;


        sendButton.textContent =
          "SEND TO AXM";


        msg.className =
          "error";


        msg.textContent =
          "Cannot connect to AXM server.";

      };


    /*
      TIMEOUT
    */

    xhr.ontimeout =
      function() {

        sendButton.disabled =
          false;


        sendButton.textContent =
          "SEND TO AXM";


        msg.className =
          "error";


        msg.textContent =
          "Upload took too long and timed out.";

      };


    /*
      ABORT
    */

    xhr.onabort =
      function() {

        sendButton.disabled =
          false;


        sendButton.textContent =
          "SEND TO AXM";


        msg.className =
          "error";


        msg.textContent =
          "Upload was cancelled.";

      };


    /*
      SEND FILE
    */

    try {

      xhr.send(formData);

    } catch(error) {

      console.error(error);


      sendButton.disabled =
        false;


      sendButton.textContent =
        "SEND TO AXM";


      msg.className =
        "error";


      msg.textContent =
        "Unable to start upload.";

    }

  }

);

</script>

</body>

</html>
