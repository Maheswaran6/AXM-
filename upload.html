<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>AXM — Send Document</title>

<link
    rel="stylesheet"
    href="/style.css"
>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef5fb;
    color: #12365d;
}

main {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
}

.upload-card {
    background: white;
    width: 100%;
    max-width: 520px;
    padding: 35px;
    border-radius: 24px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.08);
    text-align: center;
}

h1 {
    margin-top: 0;
    color: #103b68;
}

.file-box {
    margin-top: 25px;
    padding: 25px;
    border: 2px dashed #b8cce0;
    border-radius: 15px;
}

input[type="file"] {
    width: 100%;
    box-sizing: border-box;
}

.button {
    width: 100%;
    margin-top: 22px;
    padding: 15px;
    border: 0;
    border-radius: 10px;
    background: #f4c51b;
    color: #0b3158;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
}

.button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

#msg {
    margin-top: 20px;
    font-weight: bold;
}

.success {
    color: #079447;
}

.error {
    color: #d92727;
}

</style>

</head>

<body>

<main>

<section class="upload-card">

<h1>AXM — Send Document</h1>

<p>
Select <b>one PDF or one image</b>
to send to the AXM machine.
</p>

<div class="file-box">

<input
    id="file"
    type="file"
    accept=".pdf,image/jpeg,image/png,image/webp"
>

</div>

<button
    id="sendButton"
    class="button"
    type="button"
    onclick="sendDocument()"
>
SEND TO AXM
</button>

<p id="msg"></p>

</section>

</main>

<script>

const params =
    new URLSearchParams(
        window.location.search
    );

const token =
    params.get("token");

async function sendDocument() {

    const input =
        document.getElementById("file");

    const button =
        document.getElementById("sendButton");

    const msg =
        document.getElementById("msg");

    if (!input.files || input.files.length !== 1) {

        msg.className = "error";

        msg.textContent =
            "Please select one document.";

        return;
    }

    const file =
        input.files[0];

    const allowedTypes = [
        "application/pdf",
        "image/jpeg",
        "image/png",
        "image/webp"
    ];

    if (!allowedTypes.includes(file.type)) {

        msg.className = "error";

        msg.textContent =
            "Only PDF, JPG, PNG or WEBP files are allowed.";

        return;
    }

    button.disabled = true;

    msg.className = "";

    msg.textContent =
        "Uploading to AXM... Please wait.";

    try {

        const formData =
            new FormData();

        formData.append(
            "document",
            file
        );

        if (token) {

            formData.append(
                "token",
                token
            );
        }

        const url =
            token
                ? "/api/upload?token=" +
                  encodeURIComponent(token)
                : "/api/upload";

        const response =
            await fetch(
                url,
                {
                    method: "POST",
                    body: formData
                }
            );

        const text =
            await response.text();

        let result;

        try {

            result =
                JSON.parse(text);

        } catch {

            throw new Error(
                "AXM returned an invalid response. Server may not be running the latest code."
            );
        }

        if (!response.ok || !result.success) {

            throw new Error(
                result.error ||
                "Upload failed."
            );
        }

        msg.className =
            "success";

        msg.textContent =
            "✓ Document sent successfully to AXM.";

        button.disabled = true;

    } catch (error) {

        console.error(error);

        msg.className =
            "error";

        msg.textContent =
            error.message ||
            "Unable to connect to AXM.";

        button.disabled = false;
    }
}

</script>

</body>

</html>
