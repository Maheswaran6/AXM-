<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>AXM Machine</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

    <style>

        .qr-container {
            width: 280px;
            height: 280px;
            margin: 25px auto;
            background: #ffffff;
            border: 2px solid #d9e2ec;
            border-radius: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .qr-container img {
            width: 240px;
            height: 240px;
            display: block;
        }

        .upload-url {
            max-width: 700px;
            margin: 15px auto;
            word-break: break-all;
            font-size: 14px;
            color: #315b86;
        }

        .error {
            color: #d92727;
            font-weight: bold;
        }

        .success {
            color: #079447;
            font-weight: bold;
        }

        .button {
            cursor: pointer;
            text-decoration: none;
            border: none;
            display: inline-block;
        }

        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #job {
            text-align: center;
        }

    </style>

</head>

<body>

<header>

    <div class="brand">

        <span class="logo">AXM</span>

        <div>
            <b>AXM</b>

            <small>
                AUTOMATIC XEROX MACHINE • NIET • COIMBATORE
            </small>
        </div>

    </div>

    <span class="ready">
        ● READY
    </span>

</header>


<main>

<section class="panel">

    <h1>
        Send Document From Phone
    </h1>

    <p>
        Scan this QR code using the customer's phone.
    </p>


    <!-- ================================================= -->
    <!-- QR CODE -->
    <!-- ================================================= -->

    <div class="qr-container">

        <img
            id="qr"
            alt="AXM Upload QR Code"
        >

    </div>


    <!-- ================================================= -->
    <!-- UPLOAD URL -->
    <!-- ================================================= -->

    <p
        id="url"
        class="upload-url"
    >
        Generating secure upload link...
    </p>


    <p
        id="qrMessage"
        class="muted"
    ></p>


    <button
        id="newQrButton"
        class="button"
        type="button"
        onclick="newQR()"
    >
        GENERATE NEW QR
    </button>


    <hr>


    <!-- ================================================= -->
    <!-- DOCUMENT STATUS -->
    <!-- ================================================= -->

    <div id="job">

        <h2>
            Waiting for document…
        </h2>

        <p class="muted">
            Scan the QR code from the customer's phone.
        </p>

    </div>

</section>

</main>


<script>

let last = 0;

let generatingQR = false;


/* ============================================================
   GENERATE SECURE QR
   ============================================================ */

async function newQR() {

    if (generatingQR) {
        return;
    }

    generatingQR = true;

    const qr =
        document.getElementById("qr");

    const url =
        document.getElementById("url");

    const message =
        document.getElementById("qrMessage");

    const button =
        document.getElementById("newQrButton");


    button.disabled = true;

    qr.removeAttribute("src");

    url.textContent =
        "Generating secure upload link...";

    message.className =
        "muted";

    message.textContent =
        "";


    try {

        const response =
            await fetch(
                "/api/machine-qr",
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        const text =
            await response.text();


        let data;


        try {

            data =
                JSON.parse(text);

        } catch {

            throw new Error(
                "AXM server returned an invalid QR response."
            );

        }


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.error ||
                "Unable to generate QR code."
            );

        }


        if (!data.qr) {

            throw new Error(
                "QR code was not returned by the server."
            );

        }


        qr.src =
            data.qr;


        url.textContent =
            data.uploadUrl ||
            "";


        message.className =
            "success";

        message.textContent =
            "✓ Secure QR code ready. Customer can scan now.";


        /*
         * Start a fresh event position.
         * This prevents old document events from
         * immediately appearing as a new document.
         */

        last = 0;


        document.getElementById(
            "job"
        ).innerHTML = `

            <h2>
                Waiting for document…
            </h2>

            <p class="muted">
                Scan the QR code from the customer's phone.
            </p>

        `;


    } catch (error) {

        console.error(
            "QR ERROR:",
            error
        );


        qr.removeAttribute("src");


        url.textContent =
            "";


        message.className =
            "error";


        message.textContent =
            error.message ||
            "Unable to connect to AXM server.";

    } finally {

        generatingQR = false;

        button.disabled = false;

    }

}


/* ============================================================
   POLL SERVER EVENTS
   ============================================================ */

async function poll() {

    try {

        const response =
            await fetch(
                "/api/events?since=" +
                encodeURIComponent(last),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {
            return;
        }


        const events =
            await response.json();


        if (!Array.isArray(events)) {
            return;
        }


        for (
            const event of events
        ) {

            if (event.id) {

                last =
                    Math.max(
                        last,
                        Number(event.id)
                    );

            }


            if (
                event.type ===
                "document_received"
                &&
                event.job
            ) {

                render(
                    event.job
                );

            }

        }


    } catch (error) {

        console.log(
            "Waiting for document..."
        );

    }

}


/* ============================================================
   SHOW DOCUMENT RECEIVED
   ============================================================ */

function render(job) {

    const filename =
        job.filename ||
        "Document";


    const status =
        job.status ||
        "RECEIVED";


    document.getElementById(
        "job"
    ).innerHTML = `

        <h2 class="success">
            ✓ Document received
        </h2>

        <p>
            <b>${escapeHTML(filename)}</b>
        </p>

        <p>
            Status:
            <b>${escapeHTML(status)}</b>
        </p>

        <p class="success">
            The document has been successfully received by AXM.
        </p>

        <a
            class="button"
            href="/options.html"
        >
            CONTINUE
        </a>

    `;

}


/* ============================================================
   HTML ESCAPE
   ============================================================ */

function escapeHTML(value) {

    return String(value ?? "")

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* ============================================================
   START
   ============================================================ */

newQR();

setInterval(
    poll,
    1000
);

</script>

</body>

</html>
