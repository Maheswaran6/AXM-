<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>AXM Machine</title>

  <link rel="stylesheet" href="/style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>

    .qr-container {
      width: 260px;
      height: 260px;
      margin: 25px auto;
      background: white;
      border: 2px solid #d9e2ec;
      border-radius: 12px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qr {
      width: 220px;
      height: 220px;
    }

    #qr img {
      width: 220px !important;
      height: 220px !important;
      display: block;
    }

    .upload-url {
      max-width: 650px;
      margin: 15px auto;
      word-break: break-all;
      font-size: 14px;
      color: #315b86;
    }

    .error {
      color: red;
      font-weight: bold;
    }

    .success {
      color: #008f4c;
      font-weight: bold;
    }

    .button {
      cursor: pointer;
      text-decoration: none;
      border: none;
    }

  </style>

</head>


<body>


<header>

  <div class="brand">

    <span class="logo">AXM</span>

    <div>

      <b>AXM</b>

      <small>
        AUTOMATIC XEROX MACHINE • NIET • COIMBATORE
      </small>

    </div>

  </div>

  <span class="ready">
    ● READY
  </span>

</header>



<main>

<section class="panel">


  <h1>
    Send Document From Phone
  </h1>


  <p>
    Scan this QR code using the customer's phone.
  </p>



  <!-- QR CODE -->

  <div class="qr-container">

    <div id="qr"></div>

  </div>



  <!-- UPLOAD ADDRESS -->

  <p
    id="url"
    class="upload-url"
  ></p>



  <button
    class="button"
    onclick="newQR()"
  >
    GENERATE NEW QR
  </button>



  <hr>



  <!-- DOCUMENT STATUS -->

  <div id="job">

    <h2>
      Waiting for document…
    </h2>

    <p class="muted">
      Scan the QR code from the customer's phone.
    </p>

  </div>


</section>

</main>



<script>


let last = 0;



/* ==========================================
   GENERATE QR
   ========================================== */

function newQR() {

  const qrBox =
    document.getElementById("qr");

  const urlBox =
    document.getElementById("url");


  /*
   * IMPORTANT:
   * Customer's phone will open upload.html
   */

  const uploadUrl =
    window.location.origin + "/upload.html";


  /*
   * Clear old QR
   */

  qrBox.innerHTML = "";



  /*
   * Check QR library
   */

  if (typeof QRCode === "undefined") {

    qrBox.innerHTML =
      '<p class="error">QR library failed to load.</p>';

    return;

  }



  /*
   * Generate QR
   */

  new QRCode(qrBox, {

    text: uploadUrl,

    width: 220,

    height: 220,

    colorDark: "#000000",

    colorLight: "#ffffff",

    correctLevel: QRCode.CorrectLevel.H

  });



  /*
   * Display upload URL
   */

  urlBox.textContent =
    uploadUrl;

}



/* ==========================================
   CHECK FOR DOCUMENT
   ========================================== */

async function poll() {

  try {

    const response =
      await fetch(
        "/api/events?since=" + last
      );


    if (!response.ok) {

      return;

    }


    const events =
      await response.json();


    for (const event of events) {


      if (event.id) {

        last =
          Math.max(last, event.id);

      }


      if (event.job) {

        render(event.job);

      }

    }

  }

  catch (error) {

    console.log(
      "Waiting for document..."
    );

  }

}



/* ==========================================
   SHOW DOCUMENT
   ========================================== */

function render(job) {


  const filename =
    job.filename || "Document";


  const status =
    job.status || "Received";


  document.getElementById("job").innerHTML = `

    <h2 class="success">
      Document received
    </h2>

    <p>
      <b>${escapeHTML(filename)}</b>
    </p>

    <p>
      Status:
      <b>${escapeHTML(status)}</b>
    </p>

    <a
      class="button"
      href="/options.html"
    >
      CONTINUE
    </a>

  `;

}



/* ==========================================
   SECURITY
   ========================================== */

function escapeHTML(value) {

  return String(value)

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");

}



/* ==========================================
   START
   ========================================== */

newQR();

setInterval(
  poll,
  1000
);


</script>


</body>

</html>
